<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ff-stores-title ff-stores-desc" font-family="ui-sans-serif,'Segoe UI','Helvetica Neue',Helvetica,sans-serif">
<title id="ff-stores-title">fleetflow run-state stores and the teardown boundary</title>
<desc id="ff-stores-desc">Four run-scoped stores (the run directory, journal, manifest, and findings ledger) live under the repository and are removed by ff-clean, while two machine-level stores live under the home directory and outlive any single run; a single archive step copies a compact run summary across that boundary into the machine history before teardown, which is why a run's record survives the deletion of its directory.</desc>
<defs>
<marker id="fs-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<!-- zones (painted first: bg -> zones -> arrows -> nodes) -->
<rect x="32" y="76" width="480" height="276" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<rect x="52" y="80" width="284" height="12" rx="2" fill="#f5f5f5"/>
<text x="60" y="89" fill="rgba(45,49,66,0.40)" font-size="7" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" letter-spacing="0.14em">RUN-SCOPED · IN THE REPO · REMOVED BY ff-clean</text>

<rect x="592" y="76" width="336" height="276" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<rect x="612" y="80" width="268" height="12" rx="2" fill="#f5f5f5"/>
<text x="620" y="89" fill="rgba(45,49,66,0.40)" font-size="7" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" letter-spacing="0.14em">MACHINE-LEVEL · OUTLIVES EVERY RUN</text>

<!-- the one crossing: ff-archive carries a summary out before teardown -->
<path d="M 156,192 V 200 Q 156,208 164,208 H 752 Q 760,208 760,216 V 236" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#fs-arrow-accent)"/>
<rect x="512" y="186" width="56" height="12" rx="2" fill="#f5f5f5"/>
<text x="540" y="195" fill="#eb6c36" font-size="8" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle" letter-spacing="0.06em">ARCHIVE</text>

<!-- run-scoped stores -->
<rect x="56" y="112" width="200" height="80" rx="6" fill="#f5f5f5"/>
<rect x="56" y="112" width="200" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<rect x="64" y="118" width="30" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
<text x="79" y="127" fill="rgba(79,93,117,0.80)" font-size="7" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">DIR</text>
<text x="156" y="152" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Run directory</text>
<text x="156" y="168" fill="#4f5d75" font-size="9" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">.fleetflow/&lt;run&gt;/</text>
<text x="156" y="182" fill="#7a8399" font-size="8" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">packets · lanes · artifacts</text>

<rect x="288" y="112" width="200" height="80" rx="6" fill="#f5f5f5"/>
<rect x="288" y="112" width="200" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<rect x="296" y="118" width="42" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
<text x="317" y="127" fill="rgba(79,93,117,0.80)" font-size="7" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">JSONL</text>
<text x="388" y="152" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Journal</text>
<text x="388" y="168" fill="#4f5d75" font-size="9" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">journal.jsonl</text>
<text x="388" y="182" fill="#7a8399" font-size="8" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">ff-spawn · the resume cache</text>

<rect x="56" y="224" width="200" height="80" rx="6" fill="#f5f5f5"/>
<rect x="56" y="224" width="200" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<rect x="64" y="230" width="34" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
<text x="81" y="239" fill="rgba(79,93,117,0.80)" font-size="7" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">JSON</text>
<text x="156" y="264" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Manifest</text>
<text x="156" y="280" fill="#4f5d75" font-size="9" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">manifest.json</text>
<text x="156" y="294" fill="#7a8399" font-size="8" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">ff-plan writes · ff-spawn upserts</text>

<rect x="288" y="224" width="200" height="80" rx="6" fill="#f5f5f5"/>
<rect x="288" y="224" width="200" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<rect x="296" y="230" width="42" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
<text x="317" y="239" fill="rgba(79,93,117,0.80)" font-size="7" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">JSONL</text>
<text x="388" y="264" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Findings ledger</text>
<text x="388" y="280" fill="#4f5d75" font-size="9" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">findings.jsonl</text>
<text x="388" y="294" fill="#7a8399" font-size="8" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">ff-findings · append-only</text>

<!-- machine-level stores -->
<rect x="616" y="112" width="288" height="80" rx="6" fill="#f5f5f5"/>
<rect x="616" y="112" width="288" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<rect x="624" y="118" width="44" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
<text x="646" y="127" fill="rgba(79,93,117,0.80)" font-size="7" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">CACHE</text>
<text x="760" y="152" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Caches</text>
<text x="760" y="168" fill="#4f5d75" font-size="9" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">~/.fleetflow/cache/ · ~/.fleet-worker/cache/</text>
<text x="760" y="182" fill="#7a8399" font-size="8" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">dashboard · worker tmp, redirected out of lanes</text>

<rect x="616" y="236" width="288" height="80" rx="6" fill="#f5f5f5"/>
<rect x="616" y="236" width="288" height="80" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1"/>
<rect x="624" y="242" width="42" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
<text x="645" y="251" fill="#eb6c36" font-size="7" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">JSONL</text>
<text x="760" y="276" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Machine history</text>
<text x="760" y="292" fill="#4f5d75" font-size="9" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">~/.fleetflow/history.jsonl</text>
<text x="760" y="306" fill="#7a8399" font-size="8" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">ff-archive · the run outlives its directory</text>

