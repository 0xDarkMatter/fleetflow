<text x="148" y="221" fill="rgba(45,49,66,0.40)" font-size="7" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle" letter-spacing="0.14em">BUILD · INDEPENDENT LANES</text>

<rect x="48" y="368" width="592" height="112" rx="8" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="0.8" stroke-dasharray="4,4"/>
<rect x="68" y="372" width="200" height="12" rx="2" fill="#f5f5f5"/>
<text x="168" y="381" fill="rgba(235,108,54,0.70)" font-size="7" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle" letter-spacing="0.14em">VERIFY · CROSS-PROVIDER DISSENT</text>

<!-- arrows (before boxes) -->
<line x1="440" y1="160" x2="440" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#fr-arrow)"/>
<line x1="328" y1="320" x2="328" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#fr-arrow)"/>
<!-- verify verdicts -> orchestrator, up the free right corridor -->
<path d="M640,408 H648 Q656,408 656,400 V120 Q656,112 664,112 H680" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#fr-arrow-accent)"/>
