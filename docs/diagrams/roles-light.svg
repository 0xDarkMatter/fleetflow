<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ff-roles-title ff-roles-desc" font-family="ui-sans-serif,'Segoe UI','Helvetica Neue',Helvetica,sans-serif">
<title id="ff-roles-title">fleetflow agent roles by work class</title>
<desc id="ff-roles-desc">Work flows from a frontier orchestrator that plans and judges, to five independent builder lanes including GLM and the wildcard Pi, to a cross-provider verify tier of an Opus judge, refuters, and a wildcard Pi seat, whose verdicts return to the orchestrator; a wide mechanical and scout band on the same cheap models carries the volume work underneath.</desc>
<defs>
<marker id="fr-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="fr-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<!-- tier zones (painted first) -->
<rect x="240" y="48" width="480" height="112" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<rect x="260" y="52" width="180" height="12" rx="2" fill="#f5f5f5"/>
<text x="350" y="61" fill="rgba(45,49,66,0.40)" font-size="7" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle" letter-spacing="0.14em">ORCHESTRATE · FRONTIER MODELS</text>

<rect x="48" y="208" width="592" height="112" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
