<rect x="452" y="172" width="96" height="12" rx="2" fill="#f5f5f5"/>
<text x="500" y="181" fill="#7a8399" font-size="8" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle" letter-spacing="0.06em">TASK PACKETS</text>
