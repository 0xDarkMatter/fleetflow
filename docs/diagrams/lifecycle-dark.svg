<svg viewBox="0 0 960 328" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ff-life-dark-title ff-life-dark-desc" font-family="ui-sans-serif,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="ff-life-dark-title">fleetflow run lifecycle</title>
<desc id="ff-life-dark-desc">A run flows left to right from provider preflight through spawn, the collect gate, cross-provider adversarial verification, test-gated landing, and archive-then-remove cleanup; findings loop back into fix lanes until verification passes.</desc>
<defs>
<marker id="fl-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9aa0ae"/></marker>
<marker id="fl-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
</defs>
<rect width="100%" height="100%" fill="#17181c"/>

<!-- forward arrows (before boxes; endpoints share y so plain lines are legal) -->
<line x1="176" y1="140" x2="200" y2="140" stroke="#9aa0ae" stroke-width="1.2" marker-end="url(#fl-arrow)"/>
<line x1="328" y1="140" x2="352" y2="140" stroke="#9aa0ae" stroke-width="1.2" marker-end="url(#fl-arrow)"/>
<line x1="480" y1="140" x2="504" y2="140" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#fl-arrow-accent)"/>
<line x1="632" y1="140" x2="656" y2="140" stroke="#9aa0ae" stroke-width="1.2" marker-end="url(#fl-arrow)"/>
<line x1="784" y1="140" x2="808" y2="140" stroke="#9aa0ae" stroke-width="1.2" marker-end="url(#fl-arrow)"/>
<!-- fix loop: verify bottom -> spawn bottom (dashed, orthogonal) -->
<path d="M568,196 V232 Q568,240 560,240 H272 Q264,240 264,232 V196" fill="none" stroke="rgba(245,245,245,0.55)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#fl-arrow)"/>

<!-- loop label: above the dashed run, 8px gap -->
<rect x="344" y="216" width="144" height="12" rx="2" fill="#17181c"/>
<text x="416" y="225" fill="#8a93a6" font-size="8" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle" letter-spacing="0.06em">FIX LANES · ROUND+1</text>

<!-- stage boxes -->
<rect x="48" y="96" width="128" height="100" rx="6" fill="#17181c"/>
<rect x="48" y="96" width="128" height="100" rx="6" fill="#232529" stroke="#e8e8ea" stroke-width="1"/>
<text x="112" y="132" fill="#e8e8ea" font-size="12" font-weight="600" text-anchor="middle">ff-doctor</text>
<text x="112" y="152" fill="#9aa0ae" font-size="9" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">preflight probes</text>
<text x="112" y="168" fill="#9aa0ae" font-size="9" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">every provider</text>

<rect x="200" y="96" width="128" height="100" rx="6" fill="#17181c"/>
<rect x="200" y="96" width="128" height="100" rx="6" fill="#232529" stroke="#e8e8ea" stroke-width="1"/>
<text x="264" y="132" fill="#e8e8ea" font-size="12" font-weight="600" text-anchor="middle">ff-spawn</text>
<text x="264" y="152" fill="#9aa0ae" font-size="9" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">file-disjoint packets</text>
<text x="264" y="168" fill="#9aa0ae" font-size="9" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">cached by content</text>

<rect x="352" y="96" width="128" height="100" rx="6" fill="#17181c"/>
<rect x="352" y="96" width="128" height="100" rx="6" fill="#232529" stroke="#e8e8ea" stroke-width="1"/>
<text x="416" y="132" fill="#e8e8ea" font-size="12" font-weight="600" text-anchor="middle">ff-collect</text>
<text x="416" y="152" fill="#9aa0ae" font-size="9" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">per-model gate</text>
<text x="416" y="168" fill="#9aa0ae" font-size="9" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">+ escape guard</text>

<rect x="504" y="96" width="128" height="100" rx="6" fill="#17181c"/>
<rect x="504" y="96" width="128" height="100" rx="6" fill="rgba(235,108,54,0.14)" stroke="#eb6c36" stroke-width="1.2"/>
<text x="568" y="132" fill="#e8e8ea" font-size="12" font-weight="600" text-anchor="middle">verify</text>
<text x="568" y="152" fill="#9aa0ae" font-size="9" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">cross-provider</text>
<text x="568" y="168" fill="#9aa0ae" font-size="9" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">refuters · judges</text>

<rect x="656" y="96" width="128" height="100" rx="6" fill="#17181c"/>
<rect x="656" y="96" width="128" height="100" rx="6" fill="#232529" stroke="#e8e8ea" stroke-width="1"/>
<text x="720" y="132" fill="#e8e8ea" font-size="12" font-weight="600" text-anchor="middle">land</text>
<text x="720" y="152" fill="#9aa0ae" font-size="9" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">sequential merges</text>
<text x="720" y="168" fill="#9aa0ae" font-size="9" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">test-gated</text>

<rect x="808" y="96" width="128" height="100" rx="6" fill="#17181c"/>
<rect x="808" y="96" width="128" height="100" rx="6" fill="rgba(245,245,245,0.06)" stroke="#9aa0ae" stroke-width="1"/>
<text x="872" y="132" fill="#e8e8ea" font-size="12" font-weight="600" text-anchor="middle">ff-clean</text>
<text x="872" y="152" fill="#9aa0ae" font-size="9" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">archive FIRST</text>
<text x="872" y="168" fill="#9aa0ae" font-size="9" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">then remove</text>

<!-- legend -->
<line x1="32" y1="272" x2="928" y2="272" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/>
<text x="32" y="292" fill="#9aa0ae" font-size="8" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" letter-spacing="0.14em">LEGEND</text>
<line x1="104" y1="288" x2="132" y2="288" stroke="#9aa0ae" stroke-width="1.2"/>
<text x="140" y="292" fill="#9aa0ae" font-size="8" font-family="ui-monospace,'Cascadia Code',Consolas,monospace">run order</text>
<rect x="228" y="284" width="12" height="8" fill="rgba(235,108,54,0.14)" stroke="#eb6c36" stroke-width="1"/>
<text x="248" y="292" fill="#9aa0ae" font-size="8" font-family="ui-monospace,'Cascadia Code',Consolas,monospace">verify by default · never skipped silently</text>
<line x1="536" y1="288" x2="564" y2="288" stroke="rgba(245,245,245,0.55)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="572" y="292" fill="#9aa0ae" font-size="8" font-family="ui-monospace,'Cascadia Code',Consolas,monospace">findings loop until refuters run dry</text>
</svg>
