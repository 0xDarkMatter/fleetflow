    <rect x="112" y="372" width="12" height="8" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <text x="132" y="380" fill="#4f5d75" font-size="8" font-family="ui-monospace,'Cascadia Code',Consolas,monospace">FOCAL: THE ADVERSARIAL THESIS</text>
    <rect x="360" y="372" width="12" height="8" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="380" y="380" fill="#4f5d75" font-size="8" font-family="ui-monospace,'Cascadia Code',Consolas,monospace">MUTEX SEAT</text>
    <rect x="488" y="372" width="12" height="8" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <text x="508" y="380" fill="#4f5d75" font-size="8" font-family="ui-monospace,'Cascadia Code',Consolas,monospace">READ-ONLY SEAT</text>
    <line x1="632" y1="376" x2="656" y2="376" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="664" y="380" fill="#4f5d75" font-size="8" font-family="ui-monospace,'Cascadia Code',Consolas,monospace">FIX LOOP (ADR-018)</text>
