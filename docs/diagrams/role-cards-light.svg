    <text x="528" y="53" fill="rgba(45,49,66,0.40)" font-size="7" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle" letter-spacing="0.14em">BUILD</text>

    <rect x="680" y="40" width="344" height="264" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <rect x="768" y="44" width="168" height="12" rx="2" fill="#f5f5f5"/>
    <text x="852" y="53" fill="rgba(45,49,66,0.40)" font-size="7" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle" letter-spacing="0.14em">VERIFY &amp; CONSOLIDATE</text>

