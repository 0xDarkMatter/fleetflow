    <rect x="612" y="344" width="104" height="12" rx="2" fill="#f5f5f5"/>
    <text x="664" y="353" fill="#7a8399" font-size="8" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle" letter-spacing="0.06em">FINDINGS / FIX</text>

