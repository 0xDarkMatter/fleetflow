    <text x="768" y="224" fill="#4f5d75" font-size="9" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">what is missing?</text>

    <rect x="864" y="184" width="144" height="56" rx="6" fill="#f5f5f5"/>
    <rect x="864" y="184" width="144" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <text x="936" y="208" fill="#2d3142" font-size="12" font-weight="600" font-family="ui-sans-serif,'Segoe UI','Helvetica Neue',Helvetica,sans-serif" text-anchor="middle">Composer</text>
    <text x="936" y="224" fill="#4f5d75" font-size="9" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">consumes all, one result</text>

