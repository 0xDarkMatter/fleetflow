    <text x="288" y="112" fill="#4f5d75" font-size="9" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">spec authority, cited</text>

    <rect x="48" y="152" width="144" height="56" rx="6" fill="#f5f5f5"/>
    <rect x="48" y="152" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="120" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="ui-sans-serif,'Segoe UI','Helvetica Neue',Helvetica,sans-serif" text-anchor="middle">Scout</text>
    <text x="120" y="192" fill="#4f5d75" font-size="9" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">inventory, file:line</text>

    <rect x="216" y="152" width="144" height="56" rx="6" fill="#f5f5f5"/>
    <rect x="216" y="152" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="288" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="ui-sans-serif,'Segoe UI','Helvetica Neue',Helvetica,sans-serif" text-anchor="middle">Surveyor</text>
    <text x="288" y="192" fill="#4f5d75" font-size="9" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">one modality, blind</text>

    <rect x="132" y="232" width="144" height="56" rx="6" fill="#f5f5f5"/>
    <rect x="132" y="232" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="204" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="ui-sans-serif,'Segoe UI','Helvetica Neue',Helvetica,sans-serif" text-anchor="middle">Scholar</text>
    <text x="204" y="272" fill="#4f5d75" font-size="9" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">close-reads sources</text>

    <!-- ============ BUILD nodes ============ -->
    <rect x="456" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
    <rect x="456" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="528" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="ui-sans-serif,'Segoe UI','Helvetica Neue',Helvetica,sans-serif" text-anchor="middle">Builder</text>
    <text x="528" y="112" fill="#4f5d75" font-size="9" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">exclusive scope</text>

    <rect x="456" y="152" width="144" height="56" rx="6" fill="#f5f5f5"/>
    <rect x="456" y="152" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="528" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="ui-sans-serif,'Segoe UI','Helvetica Neue',Helvetica,sans-serif" text-anchor="middle">Inspector</text>
    <text x="528" y="192" fill="#4f5d75" font-size="9" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">install, run, test</text>

    <rect x="456" y="232" width="144" height="56" rx="6" fill="#f5f5f5"/>
    <rect x="456" y="232" width="144" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="528" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="ui-sans-serif,'Segoe UI','Helvetica Neue',Helvetica,sans-serif" text-anchor="middle">Warden</text>
    <text x="528" y="272" fill="#4f5d75" font-size="9" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">sole registry writer</text>

    <!-- ============ VERIFY & CONSOLIDATE nodes ============ -->
    <rect x="696" y="104" width="144" height="56" rx="6" fill="#f5f5f5"/>
    <rect x="696" y="104" width="144" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <text x="768" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="ui-sans-serif,'Segoe UI','Helvetica Neue',Helvetica,sans-serif" text-anchor="middle">Adversary</text>
    <text x="768" y="144" fill="#4f5d75" font-size="9" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">attack, never confirm</text>

    <rect x="864" y="104" width="144" height="56" rx="6" fill="#f5f5f5"/>
    <rect x="864" y="104" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="936" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="ui-sans-serif,'Segoe UI','Helvetica Neue',Helvetica,sans-serif" text-anchor="middle">Judge</text>
    <text x="936" y="144" fill="#4f5d75" font-size="9" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">stated criteria only</text>

    <rect x="696" y="184" width="144" height="56" rx="6" fill="#f5f5f5"/>
    <rect x="696" y="184" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
