    <rect x="48" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
    <rect x="48" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="120" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="ui-sans-serif,'Segoe UI','Helvetica Neue',Helvetica,sans-serif" text-anchor="middle">Architect</text>
    <text x="120" y="112" fill="#4f5d75" font-size="9" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle">options, never code</text>

