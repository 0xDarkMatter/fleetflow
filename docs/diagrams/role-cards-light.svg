    <line x1="376" y1="140" x2="438" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="378" y="112" width="60" height="12" rx="2" fill="#f5f5f5"/>
    <text x="408" y="121" fill="#7a8399" font-size="8" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle" letter-spacing="0.06em">PACKETS</text>

    <line x1="616" y1="140" x2="678" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="620" y="112" width="56" height="12" rx="2" fill="#f5f5f5"/>
    <text x="648" y="121" fill="#7a8399" font-size="8" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle" letter-spacing="0.06em">DIFFS</text>

