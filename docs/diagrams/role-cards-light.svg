<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1056 392" role="img" aria-labelledby="rolecards-title rolecards-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="rolecards-title">fleetflow role cards: the twelve seats of a run</title>
    <desc id="rolecards-desc">Twelve role personas grouped into three tiers: plan-and-discover seats author and research the plan, build seats write and test inside exclusive scopes, and verify-and-consolidate seats attack, score, and merge the work, with findings looping back to the build tier.</desc>
    <defs>

      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#f5f5f5"/>

    <!-- zones (bg -> zones -> arrows -> nodes) -->
    <rect x="32" y="40" width="344" height="264" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <rect x="140" y="44" width="128" height="12" rx="2" fill="#f5f5f5"/>
    <text x="204" y="53" fill="rgba(45,49,66,0.40)" font-size="7" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" text-anchor="middle" letter-spacing="0.14em">PLAN &amp; DISCOVER</text>

    <rect x="440" y="40" width="176" height="264" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
