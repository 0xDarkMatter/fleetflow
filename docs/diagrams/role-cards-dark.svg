<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1056 392" role="img" aria-labelledby="rolecards-dark-title rolecards-dark-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="rolecards-dark-title">fleetflow role cards: the twelve seats of a run</title>
    <desc id="rolecards-dark-desc">Twelve role personas grouped into three tiers: plan-and-discover seats author and research the plan, build seats write and test inside exclusive scopes, and verify-and-consolidate seats attack, score, and merge the work, with findings looping back to the build tier.</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>

      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#2d3142"/>

    <!-- zones (bg -> zones -> arrows -> nodes) -->
    <rect x="32" y="40" width="344" height="264" rx="8" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
    <rect x="140" y="44" width="128" height="12" rx="2" fill="#2d3142"/>
    <text x="204" y="53" fill="rgba(245,245,245,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PLAN &amp; DISCOVER</text>

    <rect x="440" y="40" width="176" height="264" rx="8" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
    <rect x="504" y="44" width="48" height="12" rx="2" fill="#2d3142"/>
    <text x="528" y="53" fill="rgba(245,245,245,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">BUILD</text>

    <rect x="680" y="40" width="344" height="264" rx="8" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
    <rect x="768" y="44" width="168" height="12" rx="2" fill="#2d3142"/>
    <text x="852" y="53" fill="rgba(245,245,245,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">VERIFY &amp; CONSOLIDATE</text>

    <!-- arrows (before nodes) -->
    <line x1="376" y1="140" x2="438" y2="140" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="378" y="112" width="60" height="12" rx="2" fill="#2d3142"/>
    <text x="408" y="121" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PACKETS</text>

    <line x1="616" y1="140" x2="678" y2="140" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="620" y="112" width="56" height="12" rx="2" fill="#2d3142"/>
    <text x="648" y="121" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DIFFS</text>

    <!-- fix-loop return: verify bottom -> under zones -> build bottom (dashed) -->
    <path d="M 784,304 V 328 Q 784,336 776,336 H 536 Q 528,336 528,328 V 306"
          fill="none" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="612" y="344" width="104" height="12" rx="2" fill="#2d3142"/>
    <text x="664" y="353" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FINDINGS / FIX</text>

    <!-- ============ PLAN & DISCOVER nodes ============ -->
    <rect x="48" y="72" width="144" height="56" rx="6" fill="#2d3142"/>
    <rect x="48" y="72" width="144" height="56" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
    <text x="120" y="96" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Architect</text>
    <text x="120" y="112" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">options, never code</text>

    <rect x="216" y="72" width="144" height="56" rx="6" fill="#2d3142"/>
    <rect x="216" y="72" width="144" height="56" rx="6" fill="rgba(191,192,192,0.10)" stroke="#8e98ac" stroke-width="1"/>
    <text x="288" y="96" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Oracle</text>
    <text x="288" y="112" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">spec authority, cited</text>

    <rect x="48" y="152" width="144" height="56" rx="6" fill="#2d3142"/>
    <rect x="48" y="152" width="144" height="56" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
    <text x="120" y="176" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Scout</text>
    <text x="120" y="192" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">inventory, file:line</text>

    <rect x="216" y="152" width="144" height="56" rx="6" fill="#2d3142"/>
    <rect x="216" y="152" width="144" height="56" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
    <text x="288" y="176" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Surveyor</text>
    <text x="288" y="192" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one modality, blind</text>

    <rect x="132" y="232" width="144" height="56" rx="6" fill="#2d3142"/>
    <rect x="132" y="232" width="144" height="56" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
    <text x="204" y="256" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Scholar</text>
    <text x="204" y="272" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">close-reads sources</text>

    <!-- ============ BUILD nodes ============ -->
    <rect x="456" y="72" width="144" height="56" rx="6" fill="#2d3142"/>
    <rect x="456" y="72" width="144" height="56" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
    <text x="528" y="96" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Builder</text>
    <text x="528" y="112" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">exclusive scope</text>

    <rect x="456" y="152" width="144" height="56" rx="6" fill="#2d3142"/>
    <rect x="456" y="152" width="144" height="56" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
    <text x="528" y="176" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Inspector</text>
    <text x="528" y="192" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">install, run, test</text>

    <rect x="456" y="232" width="144" height="56" rx="6" fill="#2d3142"/>
    <rect x="456" y="232" width="144" height="56" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
    <text x="528" y="256" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Warden</text>
    <text x="528" y="272" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sole registry writer</text>

    <!-- ============ VERIFY & CONSOLIDATE nodes ============ -->
    <rect x="696" y="104" width="144" height="56" rx="6" fill="#2d3142"/>
    <rect x="696" y="104" width="144" height="56" rx="6" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/>
    <text x="768" y="128" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Adversary</text>
    <text x="768" y="144" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">attack, never confirm</text>

    <rect x="864" y="104" width="144" height="56" rx="6" fill="#2d3142"/>
    <rect x="864" y="104" width="144" height="56" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
    <text x="936" y="128" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Judge</text>
    <text x="936" y="144" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stated criteria only</text>

    <rect x="696" y="184" width="144" height="56" rx="6" fill="#2d3142"/>
    <rect x="696" y="184" width="144" height="56" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
    <text x="768" y="208" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Critic</text>
    <text x="768" y="224" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">what is missing?</text>

    <rect x="864" y="184" width="144" height="56" rx="6" fill="#2d3142"/>
    <rect x="864" y="184" width="144" height="56" rx="6" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/>
    <text x="936" y="208" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Composer</text>
    <text x="936" y="224" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">consumes all, one result</text>

    <!-- legend -->
    <line x1="32" y1="364" x2="1024" y2="364" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
    <text x="32" y="380" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <rect x="112" y="372" width="12" height="8" rx="2" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/>
    <text x="132" y="380" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace">FOCAL: THE ADVERSARIAL THESIS</text>
    <rect x="360" y="372" width="12" height="8" rx="2" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
    <text x="380" y="380" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace">MUTEX SEAT</text>
    <rect x="488" y="372" width="12" height="8" rx="2" fill="rgba(191,192,192,0.10)" stroke="#8e98ac" stroke-width="1"/>
    <text x="508" y="380" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace">READ-ONLY SEAT</text>
    <line x1="632" y1="376" x2="656" y2="376" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="664" y="380" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace">FIX LOOP (ADR-018)</text>
  </svg>