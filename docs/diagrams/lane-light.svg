<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 456" role="img" aria-labelledby="lane-title lane-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="lane-title">anatomy of a fleetflow worker lane</title>
    <desc id="lane-desc">A task packet with its role card prepended enters an isolated worktree lane holding the guard preamble, heartbeat file, transcript stream, and working-tree artifacts; a journal records started and result keyed by content hash; the collect gate applies per-model semantics plus the escape guard and returns the final reply to the orchestrator, with an optional dashed opt-in edge to the raven telemetry bus.</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="lane-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="lane-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#f5f5f5"/>

    <!-- lane zone (bg -> zone -> arrows -> nodes) -->
    <rect x="240" y="48" width="416" height="232" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <rect x="384" y="52" width="128" height="12" rx="2" fill="#f5f5f5"/>
    <text x="448" y="61" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">WORKTREE LANE</text>
    <text x="448" y="88" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fleetflow/&lt;run&gt;/&lt;id&gt; @ .fleetflow/&lt;run&gt;/wt-&lt;id&gt;</text>

    <!-- arrows (before nodes) -->
    <!-- packet -> lane -->
    <line x1="176" y1="168" x2="238" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lane-arrow)"/>

    <!-- lane -> collect -->
    <line x1="656" y1="192" x2="718" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lane-arrow)"/>
    <rect x="660" y="172" width="56" height="12" rx="2" fill="#f5f5f5"/>
    <text x="688" y="181" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TRANSCRIPT</text>

    <!-- collect -> orchestrator -->
    <line x1="808" y1="160" x2="808" y2="106" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lane-arrow)"/>
    <rect x="816" y="120" width="76" height="12" rx="2" fill="#f5f5f5"/>
    <text x="820" y="129" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">FINAL REPLY</text>

    <!-- lane -> journal -->
    <line x1="448" y1="280" x2="448" y2="342" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lane-arrow)"/>
    <rect x="460" y="300" width="96" height="12" rx="2" fill="#f5f5f5"/>
    <text x="464" y="309" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">STARTED/RESULT</text>

    <!-- lane -> raven bus (opt-in, deliberately secondary) -->
    <path d="M 656,256 H 768 Q 776,256 776,264 V 340"
          fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#lane-arrow)"/>
    <rect x="676" y="236" width="56" height="12" rx="2" fill="#f5f5f5"/>
    <text x="704" y="245" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OPT-IN</text>

    <!-- ============ nodes ============ -->
    <!-- task packet -->
    <rect x="32" y="140" width="144" height="56" rx="6" fill="#f5f5f5"/>
    <rect x="32" y="140" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <text x="104" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">task packet</text>
    <text x="104" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">role card prepended</text>

    <!-- guard preamble -->
    <rect x="264" y="112" width="176" height="56" rx="6" fill="#f5f5f5"/>
    <rect x="264" y="112" width="176" height="56" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="352" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">guard preamble</text>
    <text x="352" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">relative paths only</text>

    <!-- transcript -->
    <rect x="456" y="112" width="176" height="56" rx="6" fill="#f5f5f5"/>
    <rect x="456" y="112" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="544" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">transcript</text>
    <text x="544" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">events &#183; live_signal</text>

    <!-- heartbeat -->
    <rect x="264" y="192" width="176" height="56" rx="6" fill="#f5f5f5"/>
    <rect x="264" y="192" width="176" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="352" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">heartbeat</text>
    <text x="352" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">./.ff-heartbeat</text>

    <!-- artifacts -->
    <rect x="456" y="192" width="176" height="56" rx="6" fill="#f5f5f5"/>
    <rect x="456" y="192" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="544" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">artifacts</text>
    <text x="544" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">working tree &#183; commits</text>

    <!-- journal -->
    <rect x="344" y="344" width="208" height="56" rx="6" fill="#f5f5f5"/>
    <rect x="344" y="344" width="208" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="448" y="368" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">journal</text>
    <text x="448" y="384" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sha256(model+prompt+opts)</text>

    <!-- ff-collect (focal gate) -->
    <rect x="720" y="164" width="176" height="56" rx="6" fill="#f5f5f5"/>
    <rect x="720" y="164" width="176" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <text x="808" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ff-collect</text>
    <text x="808" y="204" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">per-model &#183; escape guard</text>

    <!-- orchestrator -->
    <rect x="720" y="48" width="176" height="56" rx="6" fill="#f5f5f5"/>
    <rect x="720" y="48" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="808" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">orchestrator</text>
    <text x="808" y="88" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">keeps the judgment</text>

    <!-- raven bus (optional) -->
    <rect x="720" y="344" width="176" height="56" rx="6" fill="#f5f5f5"/>
    <rect x="720" y="344" width="176" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="808" y="368" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">raven bus</text>
    <text x="808" y="384" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">telemetry &#183; ADR-022</text>

    <!-- legend -->
    <line x1="32" y1="424" x2="928" y2="424" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <text x="32" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <rect x="112" y="432" width="12" height="8" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <text x="132" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">FOCAL: THE COLLECT GATE</text>
    <rect x="336" y="432" width="12" height="8" rx="2" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="356" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">GUARD (ADR-009)</text>
    <rect x="520" y="432" width="12" height="8" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="540" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">DURABLE RECORD (ADR-012)</text>
    <line x1="744" y1="436" x2="768" y2="436" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="776" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">OPT-IN (ADR-022)</text>
  </svg>
