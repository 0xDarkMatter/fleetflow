/* The most recent run that recorded who drove it. Only a fallback for the fleet
   header: a doctor probe reports the tier that is AVAILABLE, which is not the
   same claim as what actually orchestrated the last fleet. */
function latestOrchestrator() {
  let best = null, when = -1;
  for (const r of doc.runs) {
    const o = r.summary?.orchestrator, t = r.summary?.started || 0;
    if (o && t > when) { best = o; when = t; }
  }
  return best;
}

/* ── detail pane ─────────────────────────────────────────────────────────── */
function renderDetail() {
  const m = document.getElementById("main");
  let html, r = null;
  // Fleet first: it describes the machine, so it stays reachable even before
  // any run has been discovered (the cold-start case where everything else on
  // this page is an empty state).
  if (selected === "fleet") {
    // The offline verdict is cheap (binaries + `bash -n`, cached server-side),
    // so fetch it the first time this view is opened. The expensive --live
    // probe stays behind its button.
    if (!doctorDoc && !doctorPending) probeDoctor(false, false);
    html = fleetView();
  } else if (!doc.runs.length && !(doc.history || []).length) {
    html = doc.building
      ? `<div class="empty">scanning for runs…<br><span class="mono">${esc((doc.roots||[]).join("  ·  "))}</span></div>`
      : `<div class="empty">no fleetflow runs found under:<br><span class="mono">
         ${esc((doc.roots||[]).join("  ·  ") || "(no roots)")}</span><br>
         roots come from <span class="mono">${esc(doc.roots_source || "?")}</span></div>`;
  } else if (selected === "roost") {
    // tick-driven staleness refresh — no timer of its own
    if (roostDoc && roostDoc.available && !roostDoc.building
        && roostDoc.age_s != null && roostDoc.age_s > 45 && !roostPending)
      fetchRoost(false);
    html = roostView();
  } else if (selected.startsWith("repo:")) {
    html = projectView(selected.slice(5));
  } else {
    const h = selected.startsWith("hist:")
      ? (doc.history || []).find(x => histKey(x) === selected) : null;
    if (h) html = historyCard(h);
    else { r = doc.runs.find(x => runKey(x) === selected); html = r ? runDetail(r) : overview(); }
  }
  if (!paint(m, html, window)) return;
  bindCardControls(r);
}

/* Re-bound after every repaint that actually replaced nodes (see paint()):
   listeners attached to the old nodes are gone with them. */
function bindCardControls(r) {
  const ex = document.getElementById("cExpand"), co = document.getElementById("cCollapse");
  // Expand/collapse-all sets the page default AND drops the per-card
  // disagreements - otherwise "expand all" would visibly leave cards shut.
  if (ex) ex.onclick = () => { cardsDense = false; flipped.clear(); save(); renderDetail(); };
  if (co) co.onclick = () => { cardsDense = true;  flipped.clear(); save(); renderDetail(); };
  // The per-card caret was rendered but never bound - a control that looked
  // live and did nothing on every lane card on the page.
  document.querySelectorAll(".card .caret[data-card]").forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    const id = b.dataset.card;
    flipped.has(id) ? flipped.delete(id) : flipped.add(id);
    save();
    b.closest(".card").classList.toggle("collapsed", isCollapsed(id));
    b.setAttribute("aria-expanded", String(!isCollapsed(id)));
    // Keep the cached HTML honest: the next paint() compares against the string
    // it last wrote, and we just changed the DOM out from under it.
    lastHTML.delete(document.getElementById("main"));
  });
  const probe = document.getElementById("ffProbe");
  if (probe) probe.onclick = () => { probeDoctor(true, true); };
  const rr = document.getElementById("roostRefresh");
  if (rr) rr.onclick = () => { fetchRoost(true); };
  const ex2 = document.getElementById("exportRun");
  if (ex2 && r) ex2.onclick = () => {
    // Client-side blob download — nothing leaves the machine, no new endpoint.
    const blob = new Blob([JSON.stringify(r, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `fleetflow-${(r.run || "run").replace(/[^\w.-]/g, "_")}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  };
  // Drill navigation inside the pane: run cards on the FLEET/PROJECT levels and
  // breadcrumbs carry data-k, same contract as the sidebar rows.
  document.querySelectorAll("#main [data-k]").forEach(b => b.onclick = ev => {
    if (ev.target.closest(".caret")) return;   // the collapse caret is not navigation
    selected = b.dataset.k; location.hash = encodeURIComponent(selected);
    render();
  });
}

/* Shared roll-up across a mixed set of live runs + archived history records.
   Both carry the same token/elapsed field names (runs under .summary, history
   at top level), which is what makes one aggregator serve FLEET and PROJECT. */
function aggStats(runs, hist) {
  const S = r => r.summary || {};
  const lanes = runs.flatMap(r => r.lanes || []).concat(hist.flatMap(h => h.lanes || []));
  const sum = f => runs.reduce((a, r) => a + (f(S(r)) || 0), 0)
                 + hist.reduce((a, h) => a + (f(h) || 0), 0);
  const failed = lanes.filter(l => l.state === "failed").length;
  const brains = new Set();
  runs.forEach(r => (S(r).brains || []).forEach(b => brains.add(b)));
  hist.forEach(h => (h.brains || []).forEach(b => brains.add(b)));
  return {
    lanes, laneN: lanes.length, failed,
    failPct: lanes.length ? Math.round(failed / lanes.length * 100) : 0,
    tokens: sum(x => x.tokens_total), tokIn: sum(x => x.tokens_in),
    tokCached: sum(x => x.tokens_cached), tokOut: sum(x => x.tokens_out),
    runtime: sum(x => x.elapsed_s),
    cost: costRollup(lanes), brains: [...brains].sort(),
  };
}
function aggStatRow(a, live) {
  return `<div class="stats mono">
      ${live != null ? `<div class="stat ${live ? "ok" : ""}"><b>${live}</b><span>live</span></div>` : ""}
      <div class="stat"><b>${nf(a.laneN)}</b><span>lanes</span></div>
      <div class="stat"><b>${tok(a.tokens)}</b><span>tokens</span></div>
      <div class="stat"><b>${tok(a.tokOut)}</b><span>output</span></div>
      <div class="stat"><b>${tok(a.tokCached)}</b><span>cached</span></div>
      <div class="stat" title="${esc(costTitle(a.cost))}"><b>${costFmt(a.cost)}</b><span>cost</span></div>
      <div class="stat ${a.failed ? "bad" : ""}"
        title="${a.failed} of ${a.laneN} lanes ended failed"><b>${a.failPct}%</b><span>failed</span></div>
      <div class="stat" title="lane-hours summed across every run — wall-clock of the longest lane per run"><b>${fmt(a.runtime)}</b><span>runtime</span></div>
    </div>`;
}

/* FLEET — the default level: everything on the machine, all repos, live +
   archived. Click a project name for PROJECT, a run for WAVE. */
function overview() {
  const hist = doc.history || [];
  const live = doc.runs.filter(r => inflight(r.summary?.state));
  const a = aggStats(doc.runs, hist);
  const byTok = doc.runs.slice().sort((x,y) =>
    (y.summary?.tokens_total||0) - (x.summary?.tokens_total||0)).slice(0, 30);
  const chart = columnChart(byTok.map(r => ({
    name: r.run, value: r.summary?.tokens_total || 0,
    color: repoColor(r.repo_label || r.repo), state: r.summary?.state })),
    { label:"tokens per run · top 30 on disk", showX:false });
  return `<div class="rhead">
    <div class="rhead-r"><h2>${live.length ? live.length + " run" + (live.length>1?"s":"") + " in flight" : "fleet idle"}</h2>
      <span class="tag">fleet · everything on this machine</span>
      <span class="tag">${doc.totals.runs} runs · ${doc.totals.repos} repos · ${doc.totals.history_runs||0} archived</span></div>
    ${chart}${brandLegend(a.brains)}
    ${aggStatRow(a, live.length)}
    <div class="stats mono" style="margin-top:6px">
      ${doc.cache ? `<div class="stat ${doc.cache.hit_rate >= 0.9 ? "ok" : ""}"
        title="${doc.cache.hits} of ${doc.cache.hits + doc.cache.misses} runs served from cache this build — ${doc.cache.entries} entries on disk. A finished run whose directory has not changed is never re-read; this is the difference between a 29s build and a 15ms one."
        ><b>${Math.round((doc.cache.hit_rate ?? 0) * 100)}%</b><span>cache hit</span></div>` : ""}
    </div>
    <div class="note">${esc(costTitle(a.cost))}. ≈ marks estimates, * means uncosted
      lanes remain — basis per brain in ⚙ costs. Counts cover live runs AND archived
      history. Click a project name on the left for its roll-up, a run for its lanes.</div>
  </div>` + (live.length ? `<div class="phase"><div class="phase-h mono"><span>in flight</span>
      <span class="n">${live.length}</span></div>
    <div class="deck">${live.map(runCard).join("")}</div></div>` : "");
}

/* PROJECT — one repo's runs + its archived history, rolled up. */
function projectView(label) {
  const runs = sortRuns(doc.runs.filter(r => (r.repo_label || r.repo) === label));
  const onDisk = new Set(doc.runs.map(r => runKey(r).toLowerCase()));
  const hist = (doc.history || []).filter(h =>
    (h.repo_label || h.repo) === label &&
    !onDisk.has((h.repo + "|" + h.run).toLowerCase()));
  if (!runs.length && !hist.length)
    return `<div class="empty">no runs recorded for <span class="mono">${esc(label)}</span>
      — it may have been filtered out, renamed, or cleaned without archiving</div>`;
  const repoPath = runs[0]?.repo || hist[0]?.repo || "";
  const live = runs.filter(r => inflight(r.summary?.state)).length;
  const a = aggStats(runs, hist);
  const bars = runs.map(r => ({ name: r.run, value: r.summary?.tokens_total || 0,
      color: repoColor(label), state: r.summary?.state }))
    .concat(hist.map(h => ({ name: h.run, value: h.tokens_total || 0,
      color: repoColor(label), state: h.state })));
  const chart = columnChart(bars, { label: "tokens per run · on disk + archived", showX: bars.length <= 26 });
  return `<div class="rhead">
    <button class="crumb" data-k="">${ico("chev")}fleet</button>
    <div class="rhead-r"><h2><span class="dot" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${repoColor(label)}"></span> ${esc(label)}</h2>
      <span class="tag">project</span>
      <span class="tag">${runs.length} run${runs.length===1?"":"s"} on disk · ${hist.length} archived</span></div>
    <div class="path mono">${ico("folder")}${esc(repoPath)}</div>
    ${chart}${brandLegend(a.brains)}
    ${aggStatRow(a, live)}
    <div class="note">${esc(costTitle(a.cost) || "no cost data")}. Roll-up covers this
      repo's runs still on disk plus its archived history. Click a run card for the
      wave's lane grid.</div>
  </div>
  ${runs.length ? `<div class="phase"><div class="phase-h mono"><span>runs</span>
      <span class="n">${runs.length}</span></div>
    <div class="deck">${runs.map(runCard).join("")}</div></div>` : ""}
  ${hist.length ? `<div class="phase"><div class="phase-h mono"><span>archived</span>
      <span class="n">${hist.length}</span></div>
    <div class="runs" style="padding:0">${hist.map(h => `
      <button class="runrow archived" data-k="${esc(histKey(h))}">
        <div class="rl"><span class="sq ${h.state}"></span>
          <span class="nm mono">${esc(h.run)}</span>
          <span class="rs">${h.lane_count} lanes · ${tok(h.tokens_total)} · ${costFmt(costRollup(h.lanes))}</span></div>
      </button>`).join("")}</div></div>` : ""}`;
}

/* Run-level card, same shape as a lane card so the two nest visually. */
function runCard(r) {
  const s = r.summary || {}, age = ageOf(r), col = repoColor(r.repo_label || r.repo);
  return `<div class="card clickcard ${s.state==="running"?"is-running":s.state==="stalled"?"is-stalled":s.state==="failed"?"is-failed":""}"
    data-k="${esc(runKey(r))}" role="link" title="open this wave's lane grid">
    <div class="hd"><span class="dot ${s.state}" style="background:${STATE_COLOR[s.state]||col}"></span>
      <span class="proj">${esc(r.repo_label || "")}</span>${stateTag(s.state, (s.idle_s||0)+age)}</div>
    <div class="ttl mono">${esc(r.run)}</div>
    <div class="sq-row">${(r.lanes||[]).map(l =>
      `<div class="sq ${l.state}" title="${esc(l.id)}"></div>`).join("")}</div>
    <div class="statrow">
      ${chip("layers", s.lane_count||0, "lanes")}
      ${chip("clock", fmt((s.elapsed_s||0) + (inflight(s.state)?age:0)))}
      ${chip("activity", tok(s.tokens_total), "tok")}
      ${chip("coin", costFmt(costRollup(r.lanes)))}
      ${(s.brains||[]).map(b => brandMark(b, brainOf(b)[1])).join("")}
    </div>
    <div class="dir" title="${esc(r.repo)}">${ico("folder")}${esc(r.repo)}</div>
  </div>`;
}

/* The orchestrator is a brain like any other, so it gets the same provider mark.
   When it is unrecorded, say so in a dashed badge rather than guessing a model -
   a Claude Code session does not expose its own model to child processes, so a
   confident-looking wrong answer here would be pure invention. */
function orchBadge(name) {
  if (!name) return `<div class="orch unknown" title="Nothing in a Claude Code session's environment exposes its own model, so this has to be supplied at spawn time: set FLEETFLOW_ORCHESTRATOR, or pass ff-spawn --orchestrator. Runs predating that stay unrecorded rather than guessed.">
      ${ico("cpu")}<b>orchestrator unrecorded</b><span>who drove this fleet</span></div>`;
  const col = brainOf(name)[1];
  return `<div class="orch" style="border-color:${col}">${brandMark(name, col)}
    <b style="color:${col}">${esc(name)}</b><span>orchestrating</span></div>`;
}

function stateTag(state, idle) {
  if (state === "running") return `<span class="tag run">running</span>`;
  if (state === "stalled") return `<span class="tag stall">stalled ${fmt(idle)}</span>`;
  if (state === "failed")  return `<span class="tag fail">failed</span>`;
  if (state === "done")    return `<span class="tag">done</span>`;
  return "";
}

function runDetail(r) {
  if (r.error) {
    return `<div class="rhead"><div class="rhead-r"><h2>${esc(r.run)}</h2></div>
      <div class="path mono">${ico("folder")}${esc(r.repo)}</div>
      <div class="note" style="color:var(--bad)">${ico("alert")} could not read this run: ${esc(r.error)}</div>
      <div class="note">It may be mid-cleanup, on an offline drive, or have a torn journal
        write. It will reappear on its own if it comes back.</div></div>`;
  }
  const s = r.summary || {}, age = ageOf(r), lanes = r.lanes || [];
  const cr = costRollup(lanes);
  const stalledN = s.counts?.stalled || 0, failedN = s.counts?.failed || 0;
  const runningN = s.counts?.running || 0;
  const uncovered = lanes.filter(l => inflight(l.state) && !l.live_signal).length;

  const chart = columnChart(lanes.map(l => ({
    name: l.id, value: l.tokens_total || 0, color: brainOf(l.brain)[1], state: l.state })),
    { label:"tokens per lane", showX:true }) + brandLegend(s.brains);

  const head = `<div class="treectl" style="justify-content:flex-end;margin-bottom:10px">
      <button class="tbtn" id="exportRun" title="Download this run's full status document (lanes, tokens, states) as JSON — what ff-status reported, plus the roll-up">${ico("file")}export json</button>
      <button class="tbtn" id="cExpand">${ico("chev")}expand all lanes</button>
      <button class="tbtn" id="cCollapse">${ico("chev")}collapse all lanes</button>
    </div>
    <div class="rhead">
    <button class="crumb" data-k="">${ico("chev")}fleet</button>
    <button class="crumb" data-k="${esc("repo:" + (r.repo_label || r.repo))}">${esc(r.repo_label || r.repo)}</button>
    ${orchBadge(s.orchestrator)}
    <div class="rhead-r"><h2 class="mono">${esc(r.run)}</h2><span class="tag">wave</span>
      ${stateTag(s.state, (s.idle_s||0)+age)}
      ${(s.brains||[]).map(b => `<span class="tag" style="border-color:${brainOf(b)[1]};
        color:${brainOf(b)[1]};display:inline-flex;align-items:center;gap:4px;padding:1px 6px">
        ${brandMark(b, brainOf(b)[1])}${esc(b)}</span>`).join("")}</div>
    <div class="path mono">${ico("folder")}${esc(r.repo)}</div>
    ${(s.models||[]).length ? `<div class="path mono">${ico("cpu")}lanes ran ${esc((s.models||[]).join(", "))}</div>` : ""}
    <div class="sq-row" style="margin-top:9px">${lanes.map(l =>
      `<div class="sq ${l.state}" title="${esc(l.id)} — ${esc(l.state)}"></div>`).join("")}</div>
    ${chart}
    <div class="stats mono">
      <div class="stat"><b>${s.lane_count||0}</b><span>lanes</span></div>
      <div class="stat"><b>${fmt((s.elapsed_s||0)+(inflight(s.state)?age:0))}</b><span>elapsed</span></div>
      <div class="stat"><b>${tok(s.tokens_total)}</b><span>tokens</span></div>
      <div class="stat"><b>${tok(s.tokens_out)}</b><span>output</span></div>
      <div class="stat" title="${esc(costTitle(cr))}"><b>${costFmt(cr)}</b><span>cost</span></div>
      ${runningN ? `<div class="stat ok"><b>${runningN}</b><span>running</span></div>` : ""}
      ${stalledN ? `<div class="stat warn"><b>${stalledN}</b><span>stalled</span></div>` : ""}
      ${failedN  ? `<div class="stat bad"><b>${failedN}</b><span>failed</span></div>` : ""}
    </div>
    ${cr.kind !== "reported" || cr.partial ? `<div class="note">${esc(costTitle(cr))}.
      Cost basis per brain is set in the ⚙ costs dialog; token counts cover every lane
      and are the comparable figure.</div>` : ""}
    ${uncovered ? `<div class="note">${ico("alert")} ${uncovered} in-flight lane(s) emit no live
      stream (grok, or claude lanes spawned without --worktree). For those the stall detector
      reports “cannot tell”, never “healthy”.</div>` : ""}
  </div>`;

  const phases = [];
  lanes.forEach(l => { const p = l.phase || "build"; if (!phases.includes(p)) phases.push(p); });
  return head + phases.map(p => {
    const pl = lanes.filter(l => (l.phase || "build") === p);
    return `<div class="phase">
      <div class="phase-h mono"><span>${esc(p)}</span>
        <div class="sq-row">${pl.map(l => `<div class="sq ${l.state}"></div>`).join("")}</div>
        <span class="n">${pl.filter(l => !inflight(l.state)).length}/${pl.length}</span></div>
      <div class="deck">${pl.map(l => laneCard(l, age)).join("")}</div></div>`;
  }).join("");
}

/* stderr is worth the row when it explains a bad outcome, not merely because the
   lane wrote to it. Codex logs progress there routinely, so a finished lane's last
   stderr line is usually noise - unless it actually reads like a failure. */
const ERRISH = /\b(error|fatal|denied|refused|cannot|unable|panic|traceback|exception|timeout)\b/i;
const showErr = l => !!l.err_tail && (l.state === "failed" || l.state === "stalled" || ERRISH.test(l.err_tail));

/* THE ROW APPEARS ONLY WHEN IT HAS SOMETHING TO SAY.
   worktree_state is a tri-state and each value earns a different amount of
   space, because each carries a different amount of information:

     present    a branch you can actually check out and diff -> show it.
     reclaimed  the lane was landed or cleaned up. NOTHING actionable survives:
                ff-status computes commits/last_commit/branch only while the
                directory exists, so they are empty by definition. It is also
                the DEFAULT ending - 287 of 429 lanes here - so a row saying so
                is the most common line on the page and the least useful.
                Render nothing.
     none       spawned without --worktree: shared checkout, and a transcript
                the stall detector cannot attribute. That is a real caveat, so
                it gets the row AND the only colour.

   The earlier bug was rendering `reclaimed` and `none` identically as "no
   worktree" - which stated the wrong one, since it claimed every tidied-up run
   was a fleet of unsandboxed workers. Keep the three cases distinct even though
   one of them draws nothing; collapsing them is how that bug comes back. */
function worktreeLine(l) {
  const st = l.worktree_state || (l.branch ? "present" : "none");
  if (st === "present")
    return `<div class="dir" title="${esc(l.worktree || "")}">${ico("git")}${esc(l.branch || "worktree lane")}</div>`;
  if (st === "reclaimed") return "";
  return `<div class="dir" style="color:var(--warn)" title="Spawned WITHOUT --worktree: this lane wrote into the repo checkout directly, alongside its siblings. Less isolation, and its session transcript cannot be attributed to this lane, so the stall detector reports &quot;cannot tell&quot; rather than &quot;healthy&quot;.">
    ${ico("git")}no worktree lane</div>`;
}

function laneCard(l, age) {
  const [, col] = brainOf(l.brain);
  const live = inflight(l.state) ? age : 0;
  const tot = Math.max(1, l.tokens_total || 0);
  const freshPct = Math.round(((l.tokens_in || 0) / tot) * 100);
  const lc = laneCost(l);
  const lcTitle = lc.kind === "estimated" ? `estimated from tokens at ${PRICING.verified} API rates — not an invoice`
    : lc.kind === "plan" ? `covered by ${PRICING.plans[l.brain] || "a flat plan"} — no marginal cost`
    : lc.kind === "reported" ? "self-reported by the worker CLI" : "no cost figure for this lane";
  return `<div class="card ${l.state==="running"?"is-running":l.state==="stalled"?"is-stalled":l.state==="failed"?"is-failed":""}${isCollapsed(l.id)?" collapsed":""}">
    <div class="hd">
      ${brandMark(l.brain, col)}
      <span class="dot ${l.state}" style="background:${STATE_COLOR[l.state]||col}"></span>
      <span class="proj" style="color:${col};font-weight:600"
        title="${l.model ? "resolved model: " + esc(l.model) : "exact model id not recorded for this lane"}"
        >${esc(l.model || l.brain)}</span>
      <span class="tag">${esc(l.phase || "build")}</span>
      ${inflight(l.state) && !l.live_signal ? `<span class="tag" title="no live stream — for this
        lane the stall detector reports &quot;cannot tell&quot;, never &quot;healthy&quot;">no stream</span>` : ""}
      ${stateTag(l.state, l.last_activity_s + live)}
      <button class="caret" data-card="${esc(l.id)}" aria-expanded="${!isCollapsed(l.id)}"
        aria-label="${isCollapsed(l.id) ? "Expand" : "Collapse"} lane ${esc(l.id)}"
        title="${isCollapsed(l.id) ? "expand" : "collapse"} this lane">${ico("chev")}</button>
    </div>
    <div class="ttl mono">${esc(l.id)}</div>
    ${sparkline(l.density, l.density_basis, col)}
    <div class="body">
    <div class="sum">${esc(l.activity || "working")}</div>
    <div class="statrow">
      ${l.stalled
        ? chip("clock", fmt(l.last_activity_s + live), "silent", "warn")
        : chip("clock", fmt(l.elapsed_s + live))}
      ${chip("tool", nf(l.tools), "tools")}
      ${chip("git", nf(l.commits), "commits")}
      <span class="chip" title="${tok(l.tokens_in)} fresh input · ${tok(l.tokens_cached)} cache reads · ${tok(l.tokens_out)} output">
        ${ico("activity")}${tok(l.tokens_total)}<span style="color:var(--text-muted)">tok</span></span>
      <span class="chip" title="${esc(lcTitle)}">${ico("coin")}${costFmt(lc)}</span>
      ${freshPct >= 30 ? chip("alert", freshPct + "%", "fresh", "warn") : ""}
    </div>
    ${l.last_commit ? `<div class="dir" title="${esc(l.last_commit)}">${ico("git")}${esc(l.last_commit)}</div>` : ""}
    ${showErr(l) ? `<div class="errline" title="${esc(l.err_tail)}">${esc(l.err_tail)}</div>` : ""}
    ${worktreeLine(l)}
    <div class="dir">${ico("file")}${esc((l.artifact || "pending").split(/[\\/]/).pop())}</div>
    </div>
  </div>`;
}

function historyCard(h) {
  const when = h.archived_at ? new Date(h.archived_at * 1000).toLocaleString() : "—";
  const hc = costRollup(h.lanes);
  // A run can be archived and STILL on disk (ff-archive called directly rather than
  // by ff-clean). Claiming its files are gone when they are not would send someone
  // hunting for a directory that is right there.
  const onDisk = doc.runs.some(r => runKey(r).toLowerCase() === (h.repo + "|" + h.run).toLowerCase());
  const fate = onDisk
    ? `its run directory is still on disk — the live card has the full lane detail.`
    : `this run's directory has been cleaned up. Lane prompts, diffs, and transcripts
       are gone; this is the surviving index.`;
  const chart = columnChart((h.lanes || []).map(l => ({
    name: l.id, value: l.tokens_total || 0, color: brainOf(l.brain)[1], state: l.state })),
    { label:"tokens per lane", showX:true }) + brandLegend(h.brains);
  return `<div class="rhead">
    <button class="crumb" data-k="">${ico("chev")}fleet</button>
    <button class="crumb" data-k="${esc("repo:" + (h.repo_label || h.repo))}">${esc(h.repo_label || h.repo)}</button>
    <div class="rhead-r"><h2 class="mono">${esc(h.run)}</h2>
      <span class="tag">archived</span>${stateTag(h.state, 0)}
      ${(h.brains||[]).map(b => `<span class="tag" style="border-color:${brainOf(b)[1]};
        color:${brainOf(b)[1]}">${esc(b)}</span>`).join("")}</div>
    <div class="path mono">${ico("folder")}${esc(h.repo)}</div>
    ${chart}
    <div class="stats mono">
      <div class="stat"><b>${h.lane_count||0}</b><span>lanes</span></div>
      <div class="stat"><b>${fmt(h.elapsed_s)}</b><span>elapsed</span></div>
      <div class="stat"><b>${tok(h.tokens_total)}</b><span>tokens</span></div>
      <div class="stat"><b>${tok(h.tokens_out)}</b><span>output</span></div>
      <div class="stat" title="${esc(costTitle(hc))}"><b>${costFmt(hc)}</b><span>cost</span></div>
    </div>
    <div class="note">archived ${esc(when)} — ${fate}
      ${hc.kind !== "reported" || hc.partial ? esc(costTitle(hc)) + ". Archived lanes keep no "
        + "input/cache split, so uncosted brains cannot be re-estimated here." : ""}</div>
  </div>
  <div class="tablewrap"><table class="hist mono"><thead><tr><th>lane</th><th>brain</th><th>phase</th><th>state</th>
    <th class="num">elapsed</th><th class="num">tokens</th><th class="num">out</th>
    <th class="num">commits</th><th class="num">cost</th></tr></thead><tbody>
    ${(h.lanes||[]).map(l => `<tr><td>${esc(l.id)}</td>
      <td style="color:${brainOf(l.brain)[1]}">${esc(l.brain)}</td>
      <td>${esc(l.phase||"build")}</td>
      <td><span class="sq ${l.state}" style="display:inline-block"></span> ${esc(l.state)}</td>
      <td class="num">${fmt(l.elapsed_s)}</td><td class="num">${tok(l.tokens_total)}</td>
      <td class="num">${tok(l.tokens_out)}</td><td class="num">${l.commits||"—"}</td>
      <td class="num">${costFmt(laneCost(l))}</td></tr>`).join("")}
  </tbody></table></div>`;
}

/* ── wiring ──────────────────────────────────────────────────────────────── */
document.getElementById("navtoggle").onclick = () =>
  document.body.classList.toggle("nav-open");
/* Toggle, not a one-way trip: pressing it again returns you to whatever you had
   selected, so "check capacity" is a glance rather than a navigation you have to
   undo by hunting for your run again. */
let lastSelected = "";
document.getElementById("fleetbtn").onclick = () => {
  if (selected === "fleet") { selected = lastSelected; }
  else { lastSelected = selected; selected = "fleet"; }
  location.hash = selected ? encodeURIComponent(selected) : "";
  document.body.classList.remove("nav-open");
  if (doc) render();
};
/* The wordmark is "home": back to the FLEET overview from any drill level. */
const brandEl = document.querySelector(".brand b");
brandEl.style.cursor = "pointer";
brandEl.title = "fleet overview";
brandEl.onclick = () => { selected = ""; location.hash = ""; if (doc) render(); };
document.getElementById("cogbtn").onclick = openPricingModal;
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closePricingModal();
  // `/` focuses the filter from anywhere — unless the user is already typing.
  else if (e.key === "/" && !e.ctrlKey && !e.metaKey &&
           !/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName || "")) {
    e.preventDefault();
    document.getElementById("filter").focus();
  }
});
document.getElementById("filter").addEventListener("input", e => {
  filter = e.target.value.trim().toLowerCase(); if (doc) render();
});
const sortEl = document.getElementById("sort");
sortEl.value = sortMode;
sortEl.addEventListener("change", e => { sortMode = e.target.value; save(); if (doc) render(); });
document.getElementById("bExpand").onclick = () => { collapsed.clear(); save(); if (doc) renderNav(); };
document.getElementById("bCollapse").onclick = () => {
  doc.runs.forEach(r => collapsed.add(r.repo_label || r.repo));
  collapsed.add("__history__"); save(); renderNav();
};
window.addEventListener("hashchange", () => {
  selected = decodeURIComponent(location.hash.slice(1) || ""); if (doc) render();
});
document.getElementById("build").textContent = PAGE_BUILD;
tick();
fetchRoost(false);   // one boot probe decides whether the roost section exists
setInterval(tick, POLL_MS);
</script>
</body>
</html>
