<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fleetflow</title>
<!-- Favicon inline as a data URI, not a file: ff-serve.py serves exactly one
     asset (this page), so a /favicon.ico reference would 404 on every load.
     Same four-bar mark as the header logo. `#` must stay percent-encoded. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cg fill='%23378add'%3E%3Crect x='2' y='14' width='4' height='8' rx='1.4'/%3E%3Crect x='7.3' y='9' width='4' height='13' rx='1.4'/%3E%3Crect x='12.6' y='4' width='4' height='18' rx='1.4'/%3E%3Crect x='18' y='11' width='4' height='11' rx='1.4' opacity='.55'/%3E%3C/g%3E%3C/svg%3E">
<!--
  ff-dashboard.html - the machine-wide, multi-run, multi-repo fleetflow surface.

  Sibling of ff-monitor.html, NOT a replacement: ff-monitor is the single-run page
  a run dir serves next to its own status.json, and in-flight sessions depend on it
  unchanged. This page polls ONE aggregate document (api/aggregate.json, built on
  demand by ff-serve.py) covering every run the configured roots can see, plus the
  archived history of runs whose directories have already been deleted.

  CARD LANGUAGE is deliberately shared with the summon session picker
  (~/.claude/skills/summon/assets/picker-widget.html): same header shape
  (colour dot / name / tags / action icons), same title+summary block, same bar
  strip, same icon-chip stat row, same mono path footer. Two surfaces that both
  answer "what is running and what did it cost" should not look like two products.
  Summon runs inside the chat widget host, so it can use that host's CSS variables
  and the Tabler icon webfont; this page is served standalone under a strict
  zero-dependency rule, so the variables are redeclared below and the icons are
  inline SVG. Keep them visually in step - if one changes, change both.

  LOAD-BEARING VISUAL RULE, inherited from ff-monitor: the `stalled` pip is amber
  and NOT animated. A frozen pip beside pulsing ones is the entire tell that a lane
  is wedged rather than working. Animating it would destroy the only signal that
  distinguishes them. Same for the state dot on a card.

  Zero dependencies, no build step, light+dark via prefers-color-scheme.
-->
<style>
  :root { color-scheme: light dark;
    /* Names mirror the summon widget host's token set so the two surfaces can be
       diffed by eye; values are this page's own (it has no host to inherit from). */
    --bg:#fafaf8; --surface-1:#f2f1ed; --surface-2:#fff;
    --border:#e4e2dd; --border-strong:#d3d1c7; --border-accent:#378add;
    --text-primary:#1a1a17; --text-secondary:#5c5a54; --text-muted:#8a887f;
    --text-accent:#2f6fb0;
    --run:#378add; --ok:#1d9e75; --bad:#e24b4a; --warn:#c8871b; --idle:#d3d1c7;
    --bg-success:#e2f4ec; --text-success:#0f6e56;
    --bg-bad:#fbe6e5; --bg-warn:#fbf0dc;
    /* --run as raw channels too: a keyframe cannot build an rgba() from a hex
       var, and the halo needs a fading alpha. Keep the two in step. */
    --run-rgb:55,138,221;
    --on-solid:#fff;                       /* text on a solid state colour */
    /* Radius scale. Every corner in the page is one of these three - before
       they existed the file had 12/8/6/5/4/3/2/20px literals scattered across
       120 rules, which is how a "why is this card 1px rounder" bug is born. */
    --r-lg:12px; --r-md:6px; --r-sm:4px; --r-pill:20px;
    --font-mono:ui-monospace, "Cascadia Code", Consolas, monospace; }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#1c1c1a; --surface-1:#222220; --surface-2:#262624;
    --border:#3a3936; --border-strong:#4a4945; --border-accent:#5aa0e6;
    --text-primary:#ececea; --text-secondary:#b6b4ac; --text-muted:#8f8d85;
    --text-accent:#78b4f0;
    --run:#5aa0e6; --run-rgb:90,160,230; --ok:#35b98d; --bad:#f0706e;
    --warn:#e0a233; --idle:#444441;
    --on-solid:#17170f;
    --bg-success:#183a30; --text-success:#5fc9a4;
    --bg-bad:#3d2020; --bg-warn:#3a2f1a; } }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text-primary);
    font:13px/1.5 "Segoe UI", "Helvetica Neue", ui-sans-serif, sans-serif; }
  .mono { font-family:var(--font-mono); }
  button, input, select { font:inherit; color:inherit; }
  svg.i { width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2;
    stroke-linecap:round; stroke-linejoin:round; flex:none; }

  /* ── top bar ─────────────────────────────────────────────────────────── */
  .top { position:sticky; top:0; z-index:20; background:var(--surface-2);
    border-bottom:1px solid var(--border); padding:9px 14px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:8px; flex:none; }
  .brand svg { width:22px; height:22px; flex:none; }
  .brand b { font-size:15px; font-weight:600; letter-spacing:-.015em; }
  .brand .live { width:7px; height:7px; border-radius:50%; background:var(--ok);
    box-shadow:0 0 0 3px var(--bg-success); }
  .brand .live.off { background:var(--bad); box-shadow:0 0 0 3px var(--bg-bad); }
  .build { color:var(--text-muted); font-size:10px; border:1px solid var(--border);
    border-radius:var(--r-sm); padding:0 5px; white-space:nowrap; }
  .totals { color:var(--text-secondary); font-size:12px; display:flex; gap:9px;
    flex-wrap:wrap; }
  .totals b { color:var(--text-primary); font-weight:600; }
  .stamp { margin-left:auto; color:var(--text-muted); font-size:11px; }

  .banner { display:none; background:var(--bad); color:var(--on-solid); padding:7px 14px; font-size:12px; }
  .banner.on { display:block; }
  .banner.warnstyle { background:var(--warn); color:#17170f; }

  .wrap { display:grid; grid-template-columns:300px 1fr; align-items:start; }
  /* NARROW PANE (the Claude Code preview pane is ~400-500px wide). Stacking the
     tree above the content put 1386px of repo list in front of the dashboard -
     you had to scroll past every repo to see anything. So below 900px the
     sidebar becomes a DRAWER, closed by default: the run grid is what you came
     for, and the switcher is one tap away. */
  .navtoggle { display:none; border:1px solid var(--border); background:var(--surface-1);
    color:var(--text-secondary); border-radius:var(--r-md); padding:3px 9px; cursor:pointer;
    font-size:11px; align-items:center; gap:5px; }
  /* ALWAYS visible, unlike .navtoggle. The fleet view describes the machine
     rather than any run, and below 900px the sidebar that held its only entry
     point is a closed drawer - so without a top-bar button the capacity view is
     unreachable in a narrow pane and reads as never built. It is a destination,
     not a row in a list. */
  .topbtn { border:1px solid var(--border); background:var(--surface-1);
    color:var(--text-secondary); border-radius:var(--r-md); padding:3px 9px;
    cursor:pointer; font-size:11px; display:inline-flex; align-items:center; gap:5px; }
  .topbtn:hover { color:var(--text-accent); border-color:var(--border-strong); }
  .topbtn.on { border-color:var(--border-accent); color:var(--text-accent); font-weight:600; }
  @media (max-width:900px) {
    .wrap { grid-template-columns:1fr; }
    .navtoggle { display:inline-flex; }
    .stamp { display:none; }
    aside { position:fixed; top:46px; left:0; right:0; bottom:0; z-index:15;
      background:var(--bg); border-right:none; border-bottom:1px solid var(--border);
      max-height:none; display:none; overflow-y:auto; }
    body.nav-open aside { display:block; }
    main { padding:11px 12px 40px; }
    .deck { grid-template-columns:1fr; }
    .stats { gap:13px; }
  }

  /* ── sidebar ─────────────────────────────────────────────────────────── */
  aside { border-right:1px solid var(--border); padding:10px 9px 30px;
    max-height:calc(100vh - 46px); overflow-y:auto; position:sticky; top:46px; }
  .ctl { display:flex; flex-direction:column; gap:7px; margin-bottom:11px; }
  .fieldwrap { position:relative; display:flex; align-items:center; }
  .fieldwrap svg.i { position:absolute; left:8px; color:var(--text-muted); }
  .ctl input, .ctl select { width:100%; padding:6px 8px; border:1px solid var(--border);
    border-radius:var(--r-md); background:var(--bg); }
  .ctl input { padding-left:28px; }
  .ctl-row { display:flex; gap:6px; }
  .ctl-row select { flex:1; min-width:0; }
  .chips { display:flex; gap:4px; flex-wrap:wrap; }
  .fchip { font-size:11px; padding:2px 8px; border-radius:var(--r-pill); cursor:pointer;
    border:1px solid var(--border); background:transparent; color:var(--text-secondary);
    display:inline-flex; align-items:center; gap:5px; }
  .fchip.on { background:var(--surface-1); border-color:var(--border-strong);
    color:var(--text-primary); font-weight:600; }
  .fchip .sq { width:7px; height:7px; }
  .treectl { display:flex; gap:4px; align-items:center; padding:2px 2px 6px;
    border-bottom:1px solid var(--border); margin-bottom:7px; }
  .tbtn { border:0; background:transparent; color:var(--text-muted); cursor:pointer;
    font-size:11px; padding:3px 6px; border-radius:var(--r-sm); display:inline-flex;
    align-items:center; gap:4px; }
  .tbtn:hover { background:var(--surface-1); color:var(--text-accent); }
  .tbtn .cnt { margin-left:auto; }

  .repo { margin-bottom:3px; }
  /* Accordion section headers (live now / projects / history / …): quieter than
     repo rows, louder than nothing — they carve the sidebar into strata. */
  .nsec { width:100%; display:flex; align-items:center; gap:5px; border:0;
    background:none; cursor:pointer; font-size:10px; text-transform:uppercase;
    letter-spacing:.07em; color:var(--text-muted); padding:7px 4px 4px;
    border-top:1px solid var(--border); margin-top:7px; border-radius:0; }
  .nsec:hover { color:var(--text-accent); }
  .nsec svg.i { width:12px; height:12px; transition:transform .12s; }
  .nsec .n { margin-left:auto; font-family:var(--font-mono); text-transform:none; }
  /* The repo header is TWO controls, not one: the chevron folds the group, the
     name drills into the PROJECT view. One button doing both meant the project
     level had no entry point at all. */
  .repo-h { width:100%; display:flex; gap:0; align-items:stretch; }
  .repo-h .tgl { background:none; border:0; cursor:pointer; color:var(--text-muted);
    padding:4px 3px 4px 5px; border-radius:var(--r-md); display:flex; align-items:center; }
  .repo-h .tgl:hover { background:var(--surface-1); color:var(--text-accent); }
  .repo-h .sel { flex:1; min-width:0; text-align:left; background:none; cursor:pointer;
    font-size:11px; color:var(--text-secondary); padding:4px 5px;
    border:1px solid transparent; border-radius:var(--r-md);
    display:flex; gap:6px; align-items:center; }
  .repo-h .sel:hover { background:var(--surface-1); }
  .repo-h .sel.on { background:var(--surface-1); border-color:var(--border-accent); }
  .repo-h .nm { font-weight:600; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; letter-spacing:.01em; }
  .repo-h .dot { width:8px; height:8px; border-radius:50%; flex:none; }
  .repo-h .n { margin-left:auto; color:var(--text-muted); font-size:10px; flex:none; }
  .repo-h svg.i { width:12px; height:12px; color:var(--text-muted);
    transition:transform .12s; }
  .repo.collapsed svg.chev { transform:rotate(-90deg); }
  .repo.collapsed .runs { display:none; }
  .runs { padding:1px 0 5px 5px; }
  .runrow { width:100%; text-align:left; background:none; border:1px solid transparent;
    border-radius:var(--r-md); padding:5px 7px; cursor:pointer; display:block; }
  .runrow:hover { background:var(--surface-1); }
  .runrow.on { background:var(--surface-1); border-color:var(--border-accent); }
  .runrow .rl { display:flex; align-items:center; gap:6px; }
  .runrow .nm { font-weight:600; font-size:12px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .runrow .rs { margin-left:auto; font-size:10px; color:var(--text-muted); flex:none; }
  .runrow.archived .nm { color:var(--text-muted); }

  /* ── pips: the shared language with ff-monitor.html ───────────────────── */
  .sq-row { display:flex; gap:3px; flex-wrap:wrap; }
  .sq { width:8px; height:8px; border-radius:1.5px; background:var(--idle); flex:none; }
  .sq.running { background:var(--run); animation:pulse 1.1s ease-in-out infinite; }
  .sq.done { background:var(--ok); } .sq.failed { background:var(--bad); }
  .sq.stalled { background:var(--warn); }   /* amber and NOT animated - see header */
  @keyframes pulse { 50% { opacity:.3 } }
  /* Running is the state you are actually here to see, so it gets MOTION the
     others cannot borrow: a breathing halo on the card dot and a sweep across the
     card's top edge. `stalled` deliberately gets none of it - a wedged lane that
     shimmered like a working one would undo the whole point of the amber pip. */
  @keyframes halo {
    0%,100% { box-shadow:0 0 0 0 rgba(var(--run-rgb),.55) }
    50%     { box-shadow:0 0 0 5px rgba(var(--run-rgb),0) } }
  @keyframes sweep { from { background-position:-140% 0 } to { background-position:240% 0 } }
  .hd .dot.running { animation:pulse 1.1s ease-in-out infinite, halo 1.8s ease-out infinite; }
  .card.is-running { border-color:var(--run); position:relative; overflow:hidden; }
  .card.is-running::before { content:""; position:absolute; inset:0 0 auto 0; height:2px;
    background:linear-gradient(90deg,transparent,var(--run),transparent);
    background-size:40% 100%; background-repeat:no-repeat;
    animation:sweep 2.1s linear infinite; }
  .runrow.live .nm { color:var(--run); }
  .repo-h .n.live { color:var(--run); font-weight:600; }

  /* ── right pane ──────────────────────────────────────────────────────── */
  main { padding:13px 15px 46px; min-width:0; }
  .rhead { background:var(--surface-2); border:1px solid var(--border);
    border-radius:var(--r-lg); padding:14px 16px; margin-bottom:12px; }
  /* Who is DRIVING sits above the run, top-left of the main panel: it is the one
     identity that applies to the whole fleet rather than to any single lane. Same
     provider marks as the lane cards, so "Claude ran this" reads identically
     wherever it appears. */
  .orch { display:inline-flex; align-items:center; gap:7px; margin-bottom:9px;
    padding:3px 10px 3px 7px; border:1px solid var(--border); border-radius:var(--r-pill);
    background:var(--surface-1); font-size:12px; }
  .orch svg.mark { width:16px; height:16px; }
  .orch b { font-weight:600; letter-spacing:-.01em; }
  .orch span { color:var(--text-muted); font-size:11px; }
  .orch.unknown { border-style:dashed; }
  .rhead-r { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
  .rhead h2 { font-size:19px; font-weight:600; letter-spacing:-.02em; }
  .rhead .path { color:var(--text-muted); font-size:11px; word-break:break-all;
    display:flex; align-items:center; gap:5px; margin-top:5px; }

  /* column chart - the top-of-pane summary of where the tokens actually went */
  .chart { margin:13px 0 3px; }
  .chart-h { display:flex; align-items:baseline; gap:8px; font-size:10px;
    color:var(--text-muted); text-transform:uppercase; letter-spacing:.07em;
    margin-bottom:5px; }
  .chart-h .pk { margin-left:auto; text-transform:none; letter-spacing:0;
    font-family:var(--font-mono); }
  .cols-chart { display:flex; align-items:flex-end; gap:3px; height:74px;
    border-bottom:1px solid var(--border); padding-bottom:1px; }
  .bar { flex:1; min-width:3px; border-radius:2px 2px 0 0; min-height:2px;
    position:relative; cursor:default; transition:filter .1s; }
  .bar:hover { filter:brightness(1.25); }
  .bar.failed { outline:1.5px solid var(--bad); outline-offset:-1.5px; }
  .bar.stalled { outline:1.5px solid var(--warn); outline-offset:-1.5px; }
  .bar.running { animation:pulse 1.4s ease-in-out infinite; }
  .chart-x { display:flex; gap:3px; margin-top:4px; font-size:9px;
    color:var(--text-muted); font-family:var(--font-mono); }
  .chart-x span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; text-align:center; }

  .stats { display:flex; gap:18px; flex-wrap:wrap; margin-top:12px; }
  .stat b { display:block; font-size:19px; font-weight:600; letter-spacing:-.02em; }
  .stat span { font-size:10px; color:var(--text-muted); text-transform:uppercase;
    letter-spacing:.06em; }
  .stat.warn b { color:var(--warn); } .stat.bad b { color:var(--bad); }
  .stat.ok b { color:var(--ok); }
  .note { color:var(--text-muted); font-size:11px; margin-top:9px; line-height:1.5; }

  .phase { margin-bottom:13px; }
  .phase-h { display:flex; align-items:center; gap:8px; padding:2px 2px 7px;
    font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.08em; }
  .phase-h .n { margin-left:auto; font-family:var(--font-mono); }
  .deck { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:11px; }

  /* ── lane card - shape matched to the summon picker ──────────────────── */
  .card { background:var(--surface-2); border:1px solid var(--border);
    border-radius:var(--r-lg); padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
  .card.clickcard { cursor:pointer; }
  .card.clickcard:hover { border-color:var(--border-strong); }
  .crumb { display:inline-flex; align-items:center; gap:5px; border:0; background:none;
    cursor:pointer; color:var(--text-accent); font-size:11px; padding:2px 6px 2px 0; }
  .crumb:hover { text-decoration:underline; }
  .card.is-stalled { border-color:var(--warn); }
  .card.is-failed { border-color:var(--bad); }
  .hd { display:flex; align-items:center; gap:6px; min-width:0; flex-wrap:wrap; row-gap:5px; }
  .hd .dot { width:8px; height:8px; border-radius:50%; flex:none; }
  .hd .dot.running { animation:pulse 1.1s ease-in-out infinite; }
  /* Provider mark. Sized to sit level with the state dot; `fill:currentColor` is what
     lets one rule tint every brand the same way the chart tints its bars. */
  svg.mark { width:15px; height:15px; flex:none; fill:currentColor; }
  .mark.letter { width:15px; height:15px; border-radius:var(--r-sm); flex:none; display:flex;
    align-items:center; justify-content:center; color:#fff; font-size:9px;
    font-weight:700; font-family:var(--font-mono); }
  .legend { display:flex; gap:11px; flex-wrap:wrap; margin-top:10px;
    font-size:11px; color:var(--text-muted); align-items:center; }
  .legend span { display:inline-flex; align-items:center; gap:5px; }
  .proj { font-size:12px; color:var(--text-secondary); font-weight:500; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tag { font-size:10px; border-radius:var(--r-sm); padding:0 5px; border:1px solid var(--border);
    color:var(--text-muted); flex:none; }
  .tag.run { background:var(--bg-success); color:var(--text-success); border:0; font-weight:600; }
  .tag.stall { background:var(--bg-warn); color:var(--warn); border:0; font-weight:600; }
  .tag.fail { background:var(--bg-bad); color:var(--bad); border:0; font-weight:600; }
  .ttl { font-size:15px; font-weight:500; line-height:1.3; }
  .sum { font-size:12px; color:var(--text-secondary); line-height:1.5;
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2;
    overflow:hidden; word-break:break-word; }
  /* Per-card activity strip. Buckets are wall-clock for claude-family lanes and
     item-ORDINAL for codex (its --json stream carries no timestamps) - the
     card's tooltip says which, because a sequence chart passed off as a
     timeline is a lie the picture cannot disown. */
  .spark { display:flex; align-items:flex-end; gap:1.5px; height:26px; }
  .spark i { flex:1; border-radius:1px; min-height:1px; display:block; }
  .spark-l { font-size:9px; color:var(--text-muted); letter-spacing:.05em;
    text-transform:uppercase; margin-top:2px; display:flex; }
  .spark-l span:last-child { margin-left:auto; }
  /* COLLAPSE HIDES DETAIL, NEVER THE SIGNAL. The activity sparkline is rendered
     OUTSIDE .body on purpose, so a collapsed card still shows brand, state,
     model, id and the activity strip - which is the whole reason to collapse in
     the first place ("just the headlines" on a 37-lane grid). It used to sit
     inside .body, and the result was that "collapse all lanes" silently blanked
     every chart on the page: the one pixel you actually wanted was the one thing
     collapse threw away. Do not move the sparkline back inside .body. */
  .card > .body { display:flex; flex-direction:column; gap:8px; }
  .card.collapsed > .body { display:none; }
  .card .caret { margin-left:auto; border:0; background:transparent; cursor:pointer;
    color:var(--text-muted); padding:1px; border-radius:var(--r-sm); display:inline-flex; }
  .card .caret:hover { background:var(--surface-1); color:var(--text-accent); }
  .card.collapsed .caret svg { transform:rotate(-90deg); }
  .card .caret svg { transition:transform .12s; }
  .statrow { display:flex; flex-wrap:wrap; gap:4px; }
  .chip { font-size:11px; color:var(--text-secondary); background:var(--surface-1);
    border-radius:var(--r-md); padding:2px 7px; display:inline-flex; align-items:center;
    gap:4px; white-space:nowrap; }
  .chip svg.i { color:var(--text-muted); }
  .chip.warn { background:var(--bg-warn); color:var(--warn); }
  .chip.warn svg.i { color:var(--warn); }
  .dir { font-family:var(--font-mono); font-size:11px; color:var(--text-muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex;
    align-items:center; gap:5px; }
  .errline { color:var(--bad); font-size:11px; font-family:var(--font-mono);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ── fleet view: harness inventory + capacity ────────────────────────── */
  /* The one screen that answers "what CAN this machine run", as opposed to
     every other screen, which answers "what DID it run". Three registers, and
     they must stay visually distinct because they have different truth values:
     the spec list is STATIC doctrine, the observed row is MEASURED from runs,
     and the capacity dot is a PROBE that can be stale. */
  .spec { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; font-size:11px;
    margin:0; }
  .spec dt { color:var(--text-muted); white-space:nowrap; }
  .spec dd { color:var(--text-secondary); font-family:var(--font-mono); margin:0;
    overflow-wrap:anywhere; }
  .hcap { display:flex; align-items:center; gap:7px; font-size:10px;
    text-transform:uppercase; letter-spacing:.07em; color:var(--text-muted);
    border-top:1px solid var(--border); padding-top:8px; }
  .hcap .gap { margin-left:auto; text-transform:none; letter-spacing:0;
    font-family:var(--font-mono); }
  .dstat { width:8px; height:8px; border-radius:50%; flex:none; background:var(--idle); }
  .dstat.ok { background:var(--ok); }
  .dstat.fail { background:var(--bad); }
  .dstat.unreachable, .dstat.unavailable { background:var(--warn); }
  /* A harness with no CLI installed is not broken - it is a capability this box
     does not have. Dimmed, never red: red is for something that should work. */
  .card.unused { opacity:.62; }
  .checks { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
    gap:0 16px; }
  .chk { display:flex; align-items:center; gap:7px; font-size:11px; padding:4px 0;
    border-bottom:1px solid var(--border); min-width:0; }
  .chk .nm { font-family:var(--font-mono); flex:none; }
  .chk .dt { color:var(--text-muted); margin-left:auto; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }

  /* ── settings modal (pricing basis) ──────────────────────────────────── */
  /* Styled in-app modal, NEVER window.confirm/prompt: native dialog chrome
     ignores every token on this page and reads as a defect. */
  .modal-wrap { position:fixed; inset:0; z-index:40; display:none;
    align-items:flex-start; justify-content:center; padding:52px 14px 20px;
    background:color-mix(in srgb, var(--bg) 55%, transparent); }
  .modal-wrap.on { display:flex; }
  .modal { background:var(--surface-2); border:1px solid var(--border-strong);
    border-radius:var(--r-lg); max-width:560px; width:100%; max-height:calc(100vh - 80px);
    overflow-y:auto; padding:16px 18px 18px; box-shadow:0 12px 40px rgba(0,0,0,.25); }
  .modal h3 { font-size:15px; font-weight:600; display:flex; align-items:center; gap:7px; }
  .modal .sub { color:var(--text-muted); font-size:11px; margin:4px 0 12px; line-height:1.5; }
  .modal .x { margin-left:auto; border:0; background:transparent; cursor:pointer;
    color:var(--text-muted); font-size:16px; padding:2px 6px; border-radius:var(--r-sm); }
  .modal .x:hover { background:var(--surface-1); color:var(--text-accent); }
  .prow { display:flex; align-items:center; gap:8px; padding:7px 2px;
    border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .prow .nm { font-weight:600; font-size:12px; width:64px; flex:none; }
  .prow .rate { font-family:var(--font-mono); font-size:10px; color:var(--text-muted);
    width:100%; padding-left:87px; }
  .prow label { font-size:11px; color:var(--text-secondary); display:inline-flex;
    align-items:center; gap:4px; cursor:pointer; padding:2px 7px;
    border:1px solid var(--border); border-radius:var(--r-pill); }
  .prow label:has(input:checked) { border-color:var(--border-accent);
    color:var(--text-accent); font-weight:600; background:var(--surface-1); }
  .prow input { accent-color:var(--run); margin:0; }
  .modal .note { color:var(--text-muted); font-size:11px; margin-top:10px; line-height:1.5; }

  /* usage meter for the roost account pane */
  .meter { flex:1; min-width:70px; height:6px; background:var(--surface-1);
    border:1px solid var(--border); border-radius:var(--r-pill); overflow:hidden; }
  .meter i { display:block; height:100%; border-radius:var(--r-pill); }
  .mrow { display:flex; align-items:center; gap:8px; font-size:11px;
    color:var(--text-secondary); }
  .mrow .lbl { width:52px; flex:none; color:var(--text-muted); font-size:10px;
    text-transform:uppercase; letter-spacing:.05em; }
  .mrow .pct { width:34px; flex:none; text-align:right; font-family:var(--font-mono); }
  .mrow .rst { color:var(--text-muted); font-size:10px; white-space:nowrap; }

  .empty { color:var(--text-muted); padding:32px 4px; text-align:center; line-height:1.7; }
  /* A 7-column table cannot fit a 440px preview pane, and without this the whole
     PAGE scrolled sideways - every card and the top bar dragged along with it.
     Wide content scrolls inside its own box; the body never does. */
  .tablewrap { overflow-x:auto; }
  table.hist { width:100%; border-collapse:collapse; font-size:12px; min-width:420px; }
  table.hist th { text-align:left; font-size:10px; text-transform:uppercase;
    letter-spacing:.06em; color:var(--text-muted); font-weight:500;
    padding:4px 8px 6px; border-bottom:1px solid var(--border); }
  table.hist td { padding:6px 8px; border-bottom:1px solid var(--border); }
  table.hist td.num { text-align:right; font-family:var(--font-mono); }
</style>
</head>

<script>
"use strict";
const POLL_MS = 3000;
/* Shown in the top bar. This page is served with `no-store` and read fresh from
   disk per request, so a reload ALWAYS gets the current file - but an already
   open tab never re-fetches its own HTML (it only polls api/aggregate.json for
   data), so it can run last week's JavaScript indefinitely while looking live.
   That is genuinely hard to diagnose by eye and cost a long back-and-forth, so
   the build is on screen: if this string is not what you expect, you are looking
   at a stale tab and a reload is the whole fix. Bump it when you ship. */
const PAGE_BUILD = "2026-08-05 · dash-polish";

/* ── formatting ──────────────────────────────────────────────────────────── */
const fmt = s => s == null ? "—"
  : s >= 86400 ? Math.floor(s/86400)+"d"+String(Math.floor(s%86400/3600)).padStart(2,"0")+"h"
  : s >= 3600  ? Math.floor(s/3600)+"h"+String(Math.floor(s%3600/60)).padStart(2,"0")+"m"
  : s >= 60    ? Math.floor(s/60)+"m"+String(s%60).padStart(2,"0")+"s" : s+"s";
const tok = n => !n ? "—" : n >= 1e9 ? (n/1e9).toFixed(2)+"B" : n >= 1e6 ? (n/1e6).toFixed(1)+"M"
  : n >= 1e3 ? (n/1e3).toFixed(1)+"k" : String(n);
const usd = v => v == null ? "—" : v >= 100 ? "$"+v.toFixed(0) : "$"+v.toFixed(2);
const nf  = n => (n||0).toLocaleString("en-US");
/* String() first: callers pass numbers and occasionally structured objects
   (a roost profile's `error` is a dict) — `.replace` on those threw and took
   the whole render down. Escaping must never be the thing that crashes. */
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Inline SVG instead of an icon webfont - this page is served standalone under a
   strict no-external-assets rule. Same glyph vocabulary as the summon picker's
   Tabler set, so the two surfaces read as one family. */
const ICO = {
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  cpu:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>',
  tool:'<path d="M7 10a4 4 0 1 1 3.5-5.9L8 6.5 9.5 9.5 12.5 11l2.4-2.5A4 4 0 0 1 10 12l-4.5 7A2 2 0 0 1 2.5 16z"/>',

const ico = (n, cls) => `<svg class="i ${cls||""}" viewBox="0 0 24 24" aria-hidden="true">${ICO[n]||""}</svg>`;
const chip = (icon, val, lbl, cls) =>
  `<span class="chip ${cls||""}">${ico(icon)}${val}${lbl?`<span style="color:var(--text-muted)">${lbl}</span>`:""}</span>`;

   both matching the summon picker's palette so the same project reads the same
   colour on both.
   A brain's HUE is its identity and never changes between themes - codex is
   always the green one - but the light-theme values were picked against #fafaf8
   and several of them (codex #0f6e56, grok #534ab7) sit at roughly 2:1 against
   the dark #1c1c1a background, i.e. illegible exactly where the sparklines and
   chart bars need to be read. The third entry is the same hue lifted for dark.
   Consumers keep calling brainOf(b)[1] and get whichever the OS asked for. */
const BRAIN = {
  glm:   ["G","#7f77dd","#9d95f0"], codex: ["C","#0f6e56","#2fb894"],
  sonnet:["S","#d85a30","#ef7f52"], opus:  ["O","#ba7517","#dfa03c"],
  haiku: ["H","#d4537e","#ec7ba0"], fable: ["F","#378add","#6bb0ef"],
  grok:  ["X","#534ab7","#8a80e8"], native:["N","#6a8caf","#90b0d0"],

     deliberately has no provider mark in BRAND_OF and falls back to the letter
     chip. A wildcard has no brand to show, and inventing one would claim a
     provider identity the lane does not actually have. */
  pi:    ["P","#1f8a9c","#4fc3d9"] };

   icon should say and the tier is the thing the palette already says. */

const BRAND_OF = { codex:"openai", sonnet:"claude", opus:"claude", haiku:"claude", fable:"claude", native:"claude", glm:"chatglm", grok:"grok" };
const brandMark = (brain, col) => {
  const g = BRAND[BRAND_OF[brain]];
  return g ? `<svg class="mark" viewBox="${g[0]}" style="color:${col}" aria-hidden="true">${g[1]}</svg>`
           : `<span class="mark letter" style="background:${col}">${(brain||"?")[0].toUpperCase()}</span>`;
};

const PAL = ["#7F77DD","#1D9E75","#D85A30","#378ADD","#BA7517","#D4537E","#534AB7","#0F6E56","#993C1D"];
const PAL_DARK = ["#9D95F0","#35B98D","#EF7F52","#6BB0EF","#DFA03C","#EC7BA0","#8A80E8","#2FB894","#C4633A"];
/* Hash is over the label, so a repo keeps its colour across reloads AND across
   themes - only the shade changes, never which slot it landed in. */
const repoColor = n => { let h = 0; n = n || ""; for (let i=0;i<n.length;i++) h = (h*31 + n.charCodeAt(i))>>>0;
  return (DARK.matches ? PAL_DARK : PAL)[h % PAL.length]; };
const brainOf = b => { const e = BRAIN[b] || ["?", "#888780", "#a3a199"];
  return [e[0], DARK.matches ? e[2] : e[1]]; };
const STATE_COLOR = { running:"var(--run)", stalled:"var(--warn)", done:"var(--ok)",
  failed:"var(--bad)", unknown:"var(--idle)" };

/* ── state ───────────────────────────────────────────────────────────────── */
/* Keys are namespaced `ffd.` (dashboard) because ff-monitor.html ALSO stores a
   key called `ff.sort` with a disjoint value set (active|name|tokens vs this
   page's state|recent|tokens|…). Served from one origin they silently overwrite
   each other, and a monitor-written "active" fell through this page's sort
   switch to the default branch - a sort control that looked set but wasn't.
   Migrated once from the old names so nobody loses their layout. */
const LS = k => "ffd." + k;
(function migrateKeys() {
  if (localStorage.getItem("ffd.migrated")) return;
  for (const k of ["sort","states","collapsed","dense","seeded"]) {
    const old = localStorage.getItem("ff." + k);
    // `sort` is the one that could be a monitor value; drop it if it is not ours.
    if (old != null && localStorage.getItem(LS(k)) == null) localStorage.setItem(LS(k), old);
  }
  localStorage.setItem("ffd.migrated", "1");
})();

let doc = null, misses = 0, filter = "";
let selected = decodeURIComponent(location.hash.slice(1) || "");
const SORTS = ["state","recent","tokens","cost","lanes","elapsed","name"];
let sortMode = localStorage.getItem(LS("sort")) || "recent";
if (!SORTS.includes(sortMode)) sortMode = "recent";   // guard a foreign value
let stateFilter = new Set(JSON.parse(localStorage.getItem(LS("states")) || "[]"));
// Repo groups start COLLAPSED except the most recently active few. With 22 repos
// and 53 runs an all-expanded tree is a wall you have to scroll past before you
// can see anything; the runs you care about are almost always the newest ones.
// `ff.seeded` records that the default was applied once, so a user who then
// expands everything does not get re-collapsed on the next load.
const AUTO_EXPAND = 5;
let collapsed = new Set(JSON.parse(localStorage.getItem(LS("collapsed")) || "[]"));
let seeded = localStorage.getItem(LS("seeded")) === "1";
// TWO layers, because neither alone is enough on a 37-lane run: `cardsDense` is
// the page-level default (the expand-all / collapse-all buttons), and `flipped`
// is the set of lane ids that disagree with it - what the per-card caret writes.
// That gives you the move you actually want, "collapse everything, then open the
// two I am watching", and it survives the repaint. Storing the DISAGREEMENT
// rather than the state means a newly-spawned lane inherits the page default
// instead of appearing in whatever mode a same-named lane had last week.
let cardsDense = localStorage.getItem(LS("dense")) === "1";
let flipped = new Set(JSON.parse(localStorage.getItem(LS("flipped")) || "[]"));
const isCollapsed = id => cardsDense !== flipped.has(id);

const runKey  = r => (r.repo || "") + "|" + (r.run || "");
const histKey = h => "hist:" + (h.repo || "") + "|" + (h.run || "");
const inflight = s => s === "running" || s === "stalled";
/* A cached run's clocks must keep ticking without re-reading it: ff-aggregate
   stamps read_at per run, so `age` is exactly how stale this card's numbers are. */
const ageOf = r => Math.max(0, (doc?.generated_at || 0) - (r.read_at || doc?.generated_at || 0));
const save = () => { localStorage.setItem(LS("sort"), sortMode);
  localStorage.setItem(LS("states"), JSON.stringify([...stateFilter]));
  localStorage.setItem(LS("collapsed"), JSON.stringify([...collapsed]));
  localStorage.setItem(LS("dense"), cardsDense ? "1" : "0");
  localStorage.setItem(LS("flipped"), JSON.stringify([...flipped]));
  localStorage.setItem(LS("seeded"), "1"); };

/* ── pricing: what a lane actually cost ──────────────────────────────────── */
/* WHY THIS EXISTS: the numbers the workers self-report are not comparable.
   claude-family workers print total_cost_usd at Anthropic API rates - accurate
   IF you pay per-token, meaningless if the account is on a flat Claude Max
   plan. A GLM lane's figure is the Claude CLI pricing z.ai traffic at
   ANTHROPIC rates - 2-5x what z.ai actually charges. Codex and grok print
   nothing at all. Summing those as one "cost" column was the bug this
   registry fixes: every brain now gets an explicit pricing BASIS the operator
   picks in the settings cog, and every figure on the page says which kind it
   is - reported ($x), estimated (≈$x), or plan-covered (plan).

   RATE PROVENANCE (hand-verified 2026-08-05 - re-verify when a provider
   ships new models; units are $ per MILLION tokens):
     anthropic  platform.claude.com/docs/en/pricing - Fable 10/50, Opus 5/25,
                Sonnet 3/15 (intro 2/10 through 2026-08-31 not applied here),
                Haiku 1/5; cache READS 0.1x input. Cache WRITES bill 1.25x
                input, which this estimate folds into `in` - so estimates run
                a few % low on cache-heavy lanes. Self-reports include it.
     z.ai       GLM-5.2 1.40 in / 0.26 cached / 4.40 out
     openai     GPT-5.2-Codex 1.75 in / 14.00 out; cached at the standard
                OpenAI 90% cache discount (assumed, not published per-model)
     xai        grok-4.5 2.00 / 0.50 cached / 6.00 out (<=200K tier; the >200K
                surcharge tier is not modelled)
   The shape is a stub for a future provider/plan registry: add a brain key
   with {in,cached,out} and a plans entry, and the whole page picks it up. */
const PRICING = {
  verified: "2026-08-05",
  rates: {
    fable:  { in: 10,   cached: 1.00,  out: 50,   provider: "Anthropic" },
    opus:   { in: 5,    cached: 0.50,  out: 25,   provider: "Anthropic" },
    sonnet: { in: 3,    cached: 0.30,  out: 15,   provider: "Anthropic" },
    haiku:  { in: 1,    cached: 0.10,  out: 5,    provider: "Anthropic" },
    glm:    { in: 1.40, cached: 0.26,  out: 4.40, provider: "z.ai" },
    codex:  { in: 1.75, cached: 0.175, out: 14,   provider: "OpenAI" },
    grok:   { in: 2.00, cached: 0.50,  out: 6.00, provider: "xAI" },
    /* pi is the wildcard harness - 15+ providers behind one alias, so there is
       no rate that would be honest. native is a provenance label, not a brain. */
    pi: null, native: null,
  },
  plans: {
    fable: "Claude Max", opus: "Claude Max", sonnet: "Claude Max",
    haiku: "Claude Max", glm: "GLM Coding plan", codex: "ChatGPT plan",
    grok: null, pi: null, native: null,
  },
};
const BASES = [
  ["api",    "API rates",    "computed from this lane's tokens at the provider's published per-MTok rates"],
  ["plan",   "plan-covered", "the account pays a flat subscription; marginal lane cost is $0 and shows as 'plan'"],
  ["report", "self-reported","whatever the worker CLI printed (GLM prints an Anthropic-rate figure - wrong for z.ai)"],
];
/* Which bases make sense per brain: api needs a rate card, plan needs a plan. */
function basesFor(brain) {
  const out = [];
  if (PRICING.rates[brain]) out.push("api");
  if (PRICING.plans[brain]) out.push("plan");
  out.push("report");
  return out;
}
let pricingBasis = {};
try { pricingBasis = JSON.parse(localStorage.getItem("ffd.pricing") || "{}"); } catch (e) {}
const basisOf = brain => {
  const legal = basesFor(brain);
  const v = pricingBasis[brain];
  return legal.includes(v) ? v : legal[0];   // default: api where a rate exists
};
const savePricing = () => localStorage.setItem("ffd.pricing", JSON.stringify(pricingBasis));

/* One lane's cost under the chosen basis.
   Returns {usd, kind} - kind: reported | estimated | plan | none.
   Claude-family self-reports ARE API pricing (and include the cache-write
   premium the estimate approximates), so under basis=api they are preferred
   over our own arithmetic. GLM's self-report is explicitly NOT trusted under
   basis=api - it is the Anthropic-rate figure, the exact bug being fixed.
   History lanes keep only tokens_total/tokens_out, so estimates need the live
   lane's tokens_in/tokens_cached and archived lanes fall back to none. */
function laneCost(l) {
  const brain = l.brain, basis = basisOf(brain), r = PRICING.rates[brain];
  if (basis === "plan") return { usd: 0, kind: "plan" };
  if (basis === "report")
    return l.cost_usd != null ? { usd: l.cost_usd, kind: "reported" } : { usd: null, kind: "none" };
  // basis === "api"
  const anthropic = r && r.provider === "Anthropic";
  if (anthropic && l.cost_usd != null) return { usd: l.cost_usd, kind: "reported" };
  if (r && l.tokens_in != null && l.tokens_out != null) {
    const est = ((l.tokens_in || 0) * r.in + (l.tokens_cached || 0) * r.cached
               + (l.tokens_out || 0) * r.out) / 1e6;
    return { usd: est, kind: "estimated" };
  }
  return { usd: null, kind: "none" };
}
/* Roll a set of lanes up into one figure + coverage counts. `kind` is
   'reported' only when every covered lane was reported; any estimate taints
   the total into 'estimated' so the ≈ marker can never launder a guess. */
function costRollup(lanes) {
  let usd = 0, reported = 0, estimated = 0, plan = 0, none = 0;
  for (const l of lanes || []) {
    const c = laneCost(l);
    if (c.kind === "reported") { usd += c.usd; reported++; }
    else if (c.kind === "estimated") { usd += c.usd; estimated++; }
    else if (c.kind === "plan") plan++;
    else none++;
  }
  const covered = reported + estimated;
  const total = (lanes || []).length;
  return { usd: covered ? usd : null, reported, estimated, plan, none,
           covered, total,
           kind: covered === 0 ? (plan === total && total ? "plan" : "none")
               : estimated ? "estimated" : "reported",
           partial: none > 0 };
}
/* Format a cost with its honesty marker: ≈ = contains estimates, * = some
   lanes carry no figure at all (so the true spend is higher), plan = covered
   by a flat subscription. */
function costFmt(c) {
  if (!c || c.kind === "none") return "—";
  if (c.kind === "plan") return "plan";
  return (c.kind === "estimated" ? "≈" : "") + usd(c.usd) + (c.partial ? "*" : "");
}
function costTitle(c) {
  if (!c) return "";
  const bits = [];
  if (c.reported) bits.push(`${c.reported} lane(s) self-reported`);
  if (c.estimated) bits.push(`${c.estimated} estimated from tokens at ${PRICING.verified} rates`);
  if (c.plan) bits.push(`${c.plan} plan-covered (flat subscription)`);
  if (c.none) bits.push(`${c.none} with no figure — true spend is higher`);
  return bits.join(" · ");
}

/* ── settings modal ──────────────────────────────────────────────────────── */
const SPAWNABLE = ["fable", "opus", "sonnet", "haiku", "glm", "codex", "grok", "pi"];
function renderPricingModal() {
  const rows = SPAWNABLE.map(b => {
    const r = PRICING.rates[b], col = brainOf(b)[1], cur = basisOf(b);
    const radios = basesFor(b).map(id => {
      const meta = BASES.find(x => x[0] === id);
      const label = id === "plan" ? (PRICING.plans[b] || "plan") : meta[1];
      return `<label title="${esc(meta[2])}"><input type="radio" name="pb-${b}" value="${id}"
        ${cur === id ? "checked" : ""}>${esc(label)}</label>`;
    }).join("");
    const rate = r
      ? `${r.provider} · $${r.in}/M in · $${r.cached}/M cached · $${r.out}/M out`
      : "no published rate — wildcard/unpriceable brain";
    return `<div class="prow">
      <span class="nm" style="color:${col}">${esc(b)}</span>${radios}
      <span class="rate">${esc(rate)}</span></div>`;
  }).join("");
  return `<div class="modal">
    <h3>${ico("coin")}cost basis per brain
      <button class="x" id="modalclose" aria-label="Close">✕</button></h3>
    <div class="sub">How each brain's spend is priced everywhere on this page.
      <b>API rates</b> computes from the lane's own token counts at the provider's
      published prices (verified ${esc(PRICING.verified)}). <b>plan-covered</b> is for
      accounts on a flat subscription — marginal cost is $0. <b>self-reported</b>
      trusts whatever the worker CLI printed.</div>
    ${rows}
    <div class="note">Figures marked <b>≈</b> contain estimates, <b>*</b> means some
      lanes carry no figure at all (true spend is higher), and none of this is an
      invoice — token counts (<span class="mono">tokens_total</span>) remain the only
      brain-consistent comparison. GLM's self-report is the Claude CLI pricing z.ai
      traffic at Anthropic rates, which is why its default basis is API rates.
      Archived lanes keep no input/cache split, so they can't be re-estimated.</div>
  </div>`;
}
function openPricingModal() {
  const w = document.getElementById("modalwrap");
  w.innerHTML = renderPricingModal();
  w.classList.add("on");
  document.getElementById("modalclose").onclick = closePricingModal;
  w.onclick = ev => { if (ev.target === w) closePricingModal(); };
  w.querySelectorAll("input[type=radio]").forEach(inp => inp.onchange = () => {
    pricingBasis[inp.name.slice(3)] = inp.value;
    savePricing();
    // repaint the page behind the modal so the new basis shows immediately
    lastHTML.delete(document.getElementById("main"));
    if (doc) render();
  });
}
function closePricingModal() {
  const w = document.getElementById("modalwrap");
  w.classList.remove("on"); w.innerHTML = "";
}

/* ── paint: the fix for the 3s repaint ───────────────────────────────────── */
/* The pane used to be innerHTML-replaced on every poll whether or not anything
   had changed. On a fleet that is mostly idle - the common case, and the reason
   the aggregate cache exists at all - that is 20 full DOM teardowns a minute for
   no new information, and each one silently ate the page scroll position and any
   keyboard focus inside it. Tabbing through the run list was impossible: focus
   died within three seconds, every time.
   So: compare the generated HTML against what is already on screen and do
   NOTHING when it matches, which is most ticks. When it genuinely changed,
   restore the scroll offset and re-focus the equivalent node afterwards.
   Returns whether it actually painted, because listeners only need rebinding
   when the nodes they were attached to are gone. */
const lastHTML = new WeakMap();
function paint(el, html, scroller) {
  if (lastHTML.get(el) === html) return false;
  const a = document.activeElement;
  const sel = a && a !== document.body && el.contains(a) ? focusKey(a) : null;
  const pos = scroller === window ? window.scrollY : scroller ? scroller.scrollTop : null;
  el.innerHTML = html;
  lastHTML.set(el, html);
  if (pos != null) { if (scroller === window) window.scrollTo(0, pos); else scroller.scrollTop = pos; }
  if (sel) { const n = el.querySelector(sel); if (n) n.focus({ preventScroll:true }); }
  return true;
}
/* A selector that finds the SAME control in the rebuilt tree. Identity comes
   from the data-* the click handlers already key on, so nothing new is needed
   on the elements themselves. */
function focusKey(el) {
  const q = CSS.escape;
  if (el.id) return "#" + q(el.id);
  for (const d of ["k","toggle","card","s"])
    if (el.dataset[d] != null) return `[data-${d}="${q(el.dataset[d])}"]`;
  return null;
}

/* ── polling ─────────────────────────────────────────────────────────────── */
async function tick() {
  let d = null;
  try {
    const res = await fetch("api/aggregate.json?t=" + Date.now(), { cache:"no-store" });
    if (res.ok) d = await res.json();
  } catch (e) { d = null; }

  if (!d || !Array.isArray(d.runs)) {
    misses++;
    // Never let a dead aggregator masquerade as a quiet fleet. The grid stays
    // (losing it on one dropped poll would be worse) but it is explicitly
    // labelled stale, with the age of what is on screen.
    if (misses >= 2) {
      document.getElementById("dot").className = "live off";
      const age = doc ? fmt(Math.floor(Date.now()/1000) - doc.generated_at) : null;
      banner(doc
        ? `aggregator unreachable — everything below is a frozen snapshot from ${age} ago, not live`
        : "aggregator unreachable — is the fleetflow service running? (process-compose: process start fleetflow)");
    }
    return;
  }
  misses = 0; doc = d;
  document.getElementById("dot").className = "live";
  // Three distinct unhealthy states, and conflating any two of them is how the
  // predecessor page lied: (1) still building — normal, wait; (2) built but going
  // stale — the rebuild is wedged even though the server answers; (3) partial —
  // some roots unreadable. Only (1) is benign.
  if (d.building && !d.runs.length)
    banner("building the first aggregate — a cold scan of every root takes a few "
      + "minutes; this fills in on its own", true);
  else if (d.build_error)
    banner(`aggregate rebuild failed: ${d.build_error} — showing the last good result`);
  else if (d.age_s != null && d.age_s > Math.max(90, (d.ttl_s || 10) * 8) && !d.building)
    banner(`aggregate is ${fmt(d.age_s)} old and no rebuild is running — the server is up `
      + `but its build step is not completing`);
  else if (d.error && !d.building) banner(d.error);
  else {
    // Only a whole ROOT failing is worth a banner — that means a drive is gone and
    // runs are silently missing. Individual unreadable subdirectories are permanent
    // facts of this filesystem, and a banner that is always on is one nobody reads.
    const roots = (d.errors || []).filter(e => e.scope === "root");
    if (roots.length) banner(`${roots.length} configured root(s) unreadable — runs there `
      + `are missing, not absent: ` + roots.map(e => esc(e.path)).join(", "));
    else clearBanner();
  }
  render();
}
function banner(msg, warn) {
  const b = document.getElementById("banner");
  b.textContent = msg; b.className = "banner on" + (warn ? " warnstyle" : "");
}
function clearBanner() { document.getElementById("banner").className = "banner"; }

/* ── render ──────────────────────────────────────────────────────────────── */
function render() {
  const t = doc.totals || {};
  document.getElementById("totals").innerHTML =
    `<span><b>${t.live_runs || 0}</b> live</span><span><b>${t.runs || 0}</b> runs</span>` +
    `<span><b>${t.repos || 0}</b> repos</span><span><b>${t.lanes || 0}</b> lanes</span>` +
    `<span><b>${tok(t.tokens_total)}</b> tokens</span>` +
    `<span><b>${t.history_runs || 0}</b> archived</span>`;
  document.getElementById("stamp").textContent =
    new Date((doc.generated_at || 0) * 1000).toLocaleTimeString() +
    (doc.age_s != null ? ` · ${fmt(doc.age_s)} old` : "") +
    (doc.building ? " · rebuilding…" : "") +
    (doc.build_ms != null ? ` · ${doc.build_ms}ms` : "") +
    ((doc.errors || []).length ? ` · ${doc.errors.length} dir(s) skipped` : "");
  document.getElementById("stamp").title =
    (doc.errors || []).map(e => `${e.path}: ${e.error}`).join("\n") || "";
  // Tab-title badge: the cheapest alerting surface there is. A stalled lane is
  // the state most likely to be burning money while looking like progress, so
  // it earns the ⚠ even when the tab is in the background.
  const runningRuns = doc.runs.filter(x => x.summary?.state === "running").length;
  const stalledRuns = doc.runs.filter(x => x.summary?.state === "stalled").length;
  document.title = (runningRuns || stalledRuns
    ? `(${runningRuns ? runningRuns + "▶" : ""}${runningRuns && stalledRuns ? " " : ""}${stalledRuns ? stalledRuns + "⚠" : ""}) ` : "") + "fleetflow";
  const fb = document.getElementById("fleetbtn");
  fb.classList.toggle("on", selected === "fleet");
  fb.setAttribute("aria-pressed", String(selected === "fleet"));
  applyDeepLink();
  seedCollapse();
  renderChips(); renderNav(); renderDetail();
}

/* Deep-link: ?repo=<path> (and optional &run=<name>) selects a run on first load,
   so the skill can open the pane already showing the project you are working in
   instead of a machine-wide overview you then have to navigate. Path matching is
   slash- and case-insensitive because the caller's `git rev-parse` spelling
   ("X:/Forma/forma/slack") rarely matches the aggregator's ("X:\Forma\..."), and
   an exact compare would silently fall through to the overview. A hash always
   wins - it is the more specific request and survives reloads. */
let deepLinked = false;
function applyDeepLink() {
  if (deepLinked || selected || !doc.runs.length) return;
  deepLinked = true;
  const q = new URLSearchParams(location.search);
  // Backslash via charCode, and string ops instead of regexes: escaped
  // backslashes do not survive every tool that edits this file, and a mangled
  // regex literal here is UNTERMINATED - it swallows the rest of the script and
  // the whole page silently stops working. No escapes, nothing to mangle.
  const BSL = String.fromCharCode(92);
  const norm = v => { let t = String(v || '').split(BSL).join('/').toLowerCase();
                      while (t.endsWith('/')) t = t.slice(0, -1); return t; };
  const wantRepo = norm(q.get("repo") || "");
  const wantRun = (q.get("run") || "").toLowerCase();
  if (!wantRepo && !wantRun) return;
  const normRepo = r => norm(r.repo);
  let hits = doc.runs.filter(r =>
    (!wantRepo || normRepo(r) === wantRepo || normRepo(r).endsWith("/" + wantRepo.split("/").pop())) &&
    (!wantRun || (r.run || "").toLowerCase() === wantRun));
  if (!hits.length) {
    // No live run for this repo — every wave may have been cleaned. Fall back to
    // the PROJECT level so the deep-link still lands somewhere useful.
    if (wantRepo && !wantRun) {
      const h = (doc.history || []).find(x => norm(x.repo) === wantRepo ||
        norm(x.repo).endsWith("/" + wantRepo.split("/").pop()));
      if (h) { selected = "repo:" + (h.repo_label || h.repo);
               location.hash = encodeURIComponent(selected); }
    }
    return;
  }
  // in-flight first, then newest - "what is happening in this repo right now"
  hits.sort((a, b) =>
    (inflight(b.summary?.state) ? 1 : 0) - (inflight(a.summary?.state) ? 1 : 0) ||
    (b.summary?.started || 0) - (a.summary?.started || 0));
  selected = runKey(hits[0]);
  location.hash = encodeURIComponent(selected);
}

function seedCollapse() {
  if (seeded || !doc.runs.length) return;
  // newest-active repo first; anything past AUTO_EXPAND starts folded
  const newest = new Map();
  for (const r of doc.runs) {
    const g = r.repo_label || r.repo, t = r.summary?.started || 0;
    if (!newest.has(g) || newest.get(g) < t) newest.set(g, t);
  }
  const order = [...newest.entries()].sort((a, b) => b[1] - a[1]).map(e => e[0]);
  order.slice(AUTO_EXPAND).forEach(g => collapsed.add(g));
  collapsed.add("__history__");
  seeded = true; save();
}

const STATES = [["running","live"],["stalled","stalled"],["failed","failed"],["done","done"]];
function renderChips() {
  const counts = {};
  doc.runs.forEach(r => { const s = r.summary?.state || "unknown";
    counts[s] = (counts[s] || 0) + 1; });
  const painted = paint(document.getElementById("statechips"), STATES.map(([k, label]) =>
    `<button class="fchip ${stateFilter.has(k) ? "on" : ""}" data-s="${k}"
       title="show only ${label} runs"><span class="sq ${k}"></span>${label}
       <span style="color:var(--text-muted)">${counts[k] || 0}</span></button>`).join(""));
  if (!painted) return;
  document.querySelectorAll(".fchip").forEach(b => b.onclick = () => {
    const s = b.dataset.s;
    stateFilter.has(s) ? stateFilter.delete(s) : stateFilter.add(s);
    save(); render();
  });
}

function matches(text) { return !filter || text.toLowerCase().includes(filter); }
function passesState(r) {
  return !stateFilter.size || stateFilter.has(r.summary?.state || "unknown");
}
function sortRuns(list) {
  const rank = { stalled:0, running:1, failed:2, done:3, unknown:4 };
  const x = list.slice();
  const S = r => r.summary || {};
  if (sortMode === "tokens")  x.sort((a,b) => (S(b).tokens_total||0)-(S(a).tokens_total||0));
  else if (sortMode === "cost")    x.sort((a,b) =>
    (costRollup(b.lanes).usd||0)-(costRollup(a.lanes).usd||0));
  else if (sortMode === "lanes")   x.sort((a,b) => (S(b).lane_count||0)-(S(a).lane_count||0));
  else if (sortMode === "elapsed") x.sort((a,b) => (S(b).elapsed_s||0)-(S(a).elapsed_s||0));
  else if (sortMode === "recent")  x.sort((a,b) => (S(b).started||0)-(S(a).started||0));
  else if (sortMode === "name")    x.sort((a,b) => (a.run||"").localeCompare(b.run||""));
  else x.sort((a,b) => (rank[S(a).state] ?? 9) - (rank[S(b).state] ?? 9)
                    || (S(b).started||0) - (S(a).started||0));
  return x;
}

function renderNav() {
  const groups = new Map();
  let shown = 0;
  for (const r of sortRuns(doc.runs)) {
    if (!passesState(r)) continue;
    if (!matches(r.run + " " + (r.repo_label || "") + " " + r.repo)) continue;
    const g = r.repo_label || r.repo;
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(r); shown++;
  }
  // Pinned above the tree and never filtered out: "what can this machine run"
  // is a property of the machine, not of whatever subset of runs is on screen.
  const brainsSeen = new Set();
  for (const r of doc.runs) (r.summary?.brains || []).forEach(b => brainsSeen.add(b));
  for (const h of (doc.history || [])) (h.brains || []).forEach(b => brainsSeen.add(b));
  /* Accordion section: same fold contract as a repo group (data-toggle key in
     the shared `collapsed` set, `.repo.collapsed .runs` hides the body), so
     paint(), persistence, and the collapse-all buttons all keep working.
     Section keys are `__name__` — reserved namespace that can never collide
     with a repo label (labels come from paths and never start with _). */
  const navSection = (key, icon, title, count, body) =>
    `<div class="repo ${collapsed.has(key) ? "collapsed" : ""}">
      <button class="nsec" data-toggle="${key}">${ico("chev","chev")}
        ${ico(icon)}<span>${title}</span><span class="n">${count}</span></button>
      <div class="runs">${body}</div></div>`;

  // Pinned capability destinations — never filtered, never folded: they
  // describe the machine, not any subset of runs.
  let html = `<button class="runrow ${selected === "fleet" ? "on" : ""}" data-k="fleet"
      title="harnesses, models, and live capacity">
      <div class="rl">${ico("cpu")}<span class="nm">fleet · harnesses</span>
        <span class="rs">${brainsSeen.size} in use</span></div></button>`;
  // Conditional: only machines with the roost CLI installed get the section —
  // the server said available:false everywhere else, so no dead menu entry.
  if (roostDoc && roostDoc.available) {
    const rc = roostDoc.counts || {};
    html += `<button class="runrow ${selected === "roost" ? "on" : ""}" data-k="roost"
      title="Claude Code OAuth profile health via roost (claude-lb)">
      <div class="rl">${ico("key")}<span class="nm">roost · accounts</span>
        <span class="rs">${rc.ok ?? "…"}${rc.count != null ? "/" + rc.count + " ok" : ""}</span></div></button>`;
  }

  // LIVE NOW — every in-flight run across every repo, one click deep. The same
  // runs also appear under their project; the duplication IS the feature.
  const liveRuns = [...groups.values()].flat().filter(r => inflight(r.summary?.state));
  if (liveRuns.length) {
    html += navSection("__live__", "activity", "live now", liveRuns.length,
      liveRuns.map(r => {
        const s = r.summary || {};
        return `<button class="runrow live ${selected === runKey(r) ? "on" : ""}"
          data-k="${esc(runKey(r))}">
          <div class="rl"><span class="sq ${s.state}"></span>
            <span class="nm mono">${esc(r.run)}</span>
            <span class="rs">${esc(r.repo_label || "")}</span></div></button>`;
      }).join(""));
  }

  // PROJECTS — the grouped-by-repo tree.
  let repoHtml = "";
  for (const [label, runs] of groups) {
    const live = runs.filter(r => inflight(r.summary?.state)).length;
    const isC = collapsed.has(label);
    const pk = "repo:" + label;
    repoHtml += `<div class="repo ${isC ? "collapsed" : ""}" data-g="${esc(label)}">
      <div class="repo-h">
        <button class="tgl" data-toggle="${esc(label)}"
          aria-label="${isC ? "Expand" : "Collapse"} ${esc(label)}">${ico("chev","chev")}</button>
        <button class="sel${selected === pk ? " on" : ""}" data-k="${esc(pk)}"
          title="project view — every ${esc(label)} run and its archived history, rolled up">
          <span class="dot" style="background:${repoColor(label)}"></span>
          <span class="nm">${esc(label)}</span>
          <span class="n${live ? " live" : ""}">${live ? live + " live" : runs.length}</span>
        </button>
      </div>
      <div class="runs">${runs.map(runRow).join("")}</div></div>`;
  }
  if (groups.size) html += navSection("__projects__", "folder", "projects", groups.size, repoHtml);

  // HISTORY — a peer section in the same tree, not a separate screen: a run that
  // was live an hour ago and cleaned since should be one click away. Runs still
  // on disk are suppressed so nothing appears twice while both live and archived.
  const onDisk = new Set(doc.runs.map(r => runKey(r).toLowerCase()));
  const hist = (doc.history || []).filter(h =>
    !onDisk.has((h.repo + "|" + h.run).toLowerCase()) &&
    matches(h.run + " " + (h.repo_label || "") + " " + h.repo) &&
    (!stateFilter.size || stateFilter.has(h.state)));
  if (hist.length) {
    // data-toggle MUST equal the key the handler stores (`__history__`) — a
    // mismatched key here once made the group refuse to fold while the
    // collapse-all button folded it fine.
    html += navSection("__history__", "db", "history · cleaned up", hist.length,
      hist.map(h => `
        <button class="runrow archived ${selected === histKey(h) ? "on" : ""}"
          data-k="${esc(histKey(h))}">
          <div class="rl"><span class="sq ${h.state}"></span>
            <span class="nm mono">${esc(h.run)}</span>
            <span class="rs">${tok(h.tokens_total)}</span></div>
          <div class="rl" style="margin-top:2px"><span class="rs" style="margin-left:14px">
            ${esc(h.repo_label||"")} · ${h.lane_count} lanes · ${costFmt(costRollup(h.lanes))}</span></div>
        </button>`).join(""));
  }
  if (!groups.size && !hist.length)
    html += `<div class="empty" style="padding:18px 4px">no runs match</div>`;
  document.getElementById("navcount").textContent =
    `${shown}${hist.length ? " + " + hist.length : ""} shown`;
  // The sidebar is its own scroll container, so it needs its own offset kept.
  if (!paint(document.getElementById("nav"), html, document.querySelector("aside"))) return;

  document.querySelectorAll("[data-toggle]").forEach(b => b.onclick = () => {
    const g = b.dataset.toggle;
    collapsed.has(g) ? collapsed.delete(g) : collapsed.add(g);
    save(); renderNav();
  });
  // Generic: anything in the nav carrying data-k selects that key — run rows,
  // repo names (project view), the pinned fleet entry.
  document.querySelectorAll("#nav [data-k]").forEach(b => b.onclick = () => {
    selected = b.dataset.k; location.hash = encodeURIComponent(selected);
    document.body.classList.remove("nav-open");   // picking closes the drawer
    render();
  });
}

function runRow(r) {
  const s = r.summary || {}, k = runKey(r), age = ageOf(r);
  const pips = (r.lanes || []).slice(0, 44).map(l => `<div class="sq ${l.state}"></div>`).join("");
  const label = r.error ? `<span style="color:var(--bad)">unreadable</span>`
    : s.state === "stalled" ? `<span style="color:var(--warn)">${fmt((s.idle_s||0)+age)} silent</span>`
    : s.state === "running" ? `${s.counts?.running || 0} running`
    : tok(s.tokens_total);
  return `<button class="runrow ${selected === k ? "on" : ""}${inflight(s.state) ? " live" : ""}" data-k="${esc(k)}">
      <div class="rl"><span class="nm mono">${esc(r.run)}</span><span class="rs">${label}</span></div>
      <div class="sq-row" style="margin-top:4px">${pips}</div></button>`;
}

/* ── column chart ────────────────────────────────────────────────────────── */
/* One column per item, height proportional to value. This is the chart that makes
   the cross-brain cost story visible at a glance: a codex lane at 5.4M next to a
   GLM lane at 42.6k is a 100x column, not two numbers you have to compare by eye. */
function sparkline(d, basis, col) {
  if (!Array.isArray(d) || !d.length || !d.some(v => v > 0)) return "";
  const max = Math.max(...d, 1);
  const tip = basis === "time" ? "activity over elapsed time"
            : basis === "sequence" ? "activity by step order — this brain's stream carries no timestamps"
            : "activity";
  return `<div><div class="spark" title="${tip}">${d.map(v =>
      `<i style="height:${v > 0 ? Math.max(2, Math.round(v/max*26)) : 1}px;background:${col};
        opacity:${v > 0 ? 1 : .18}"></i>`).join("")}</div>
    <div class="spark-l"><span>${basis === "sequence" ? "by step" : "over time"}</span>
      <span>peak ${max}</span></div></div>`;
}

/* Per-harness token distribution, for the fleet view's cards.
   SORTED DESCENDING on purpose. It borrows the sparkline's bar-strip shape, and
   an unsorted strip in that shape reads as activity-over-time - which is exactly
   the lie the sparkline's own comment warns about, because a harness card has no
   time series to show. Sorted, it is unambiguously a distribution: how wide the
   spread between this brain's biggest and smallest lane is, which is the thing
   that actually explains its share of the bill. */
function distBars(values, col) {
  const v = (values || []).filter(x => x > 0).sort((a, b) => b - a).slice(0, 28);
  if (v.length < 2) return "";
  const max = v[0];
  return `<div><div class="spark" title="one bar per lane, largest first — the spread between this harness's heaviest and lightest lane">
    ${v.map(x => `<i style="height:${Math.max(2, Math.round(x / max * 26))}px;background:${col}"></i>`).join("")}
    </div><div class="spark-l"><span>tokens per lane</span>
      <span>peak ${tok(max)} · ${v.length} lanes</span></div></div>`;
}

function brandLegend(brains) {
  if (!brains || brains.length < 2) return "";
  return `<div class="legend">${brains.map(b => {
    const c = brainOf(b)[1];
    return `<span style="color:${c}">${brandMark(b, c)}<span style="color:var(--text-secondary)">${esc(b)}</span></span>`;
  }).join("")}</div>`;
}

function columnChart(items, { label, sub, showX }) {
  if (!items.length) return "";
  const max = Math.max(...items.map(i => i.value), 1);
  const peak = items.reduce((a,b) => b.value > a.value ? b : a, items[0]);
  const bars = items.map(i => {
    const h = i.value > 0 ? Math.max(3, Math.round(i.value / max * 72)) : 2;
    return `<div class="bar ${i.state||""}" style="height:${h}px;background:${i.color};
      ${i.value ? "" : "opacity:.25;"}"
      title="${esc(i.name)} — ${tok(i.value)} tokens · ${esc(i.state||"")}"></div>`;
  }).join("");
  const xs = showX && items.length <= 26
    ? `<div class="chart-x">${items.map(i =>
        `<span title="${esc(i.name)}">${esc(i.name)}</span>`).join("")}</div>` : "";
  return `<div class="chart">
    <div class="chart-h"><span>${esc(label)}</span>
      ${sub ? `<span style="text-transform:none;letter-spacing:0">${esc(sub)}</span>` : ""}
      <span class="pk">peak ${esc(peak.name)} · ${tok(peak.value)}</span></div>
    <div class="cols-chart">${bars}</div>${xs}</div>`;
}

/* ── fleet inventory ─────────────────────────────────────────────────────── */
/* Every other view answers "what did this fleet DO". This one answers "what can
   it RUN", and it deliberately keeps three registers apart because they have
   different truth values and mixing them is how a dashboard starts lying:

     spec      STATIC doctrine, transcribed from SKILL.md / worker-contracts.md.
               Always true, never measured.
     observed  MEASURED off the aggregate + archived history. Facts about lanes
               that really executed on this machine.
     capacity  a PROBE (ff-doctor via api/doctor.json). Point-in-time, cacheable,
               and stale the moment it lands - so it is always shown with its age.

   The spec column is hand-maintained on purpose: it encodes contracts that live
   in prose (sandbox posture, commit ability, concurrency ceilings) and that no
   run artifact reports. When a brain's contract changes in SKILL.md, change it
   here in the same commit. */
const HARNESS = [
  { k:"fable", cls:"Anthropic", proc:"claude -p --model claude-fable-5",
    auth:"host Claude Code auth", sandbox:"worktree lane",
    stream:"session transcript", conc:"4–6", commits:true,
    role:"orchestrator · judge",

/* `native` is not in the table on purpose: it is the marker ff-import stamps on
   a lane salvaged from a native Claude Code Workflow run. It is a provenance
   label, not a harness you can spawn, so listing it as capacity would be wrong. */

const STATUS_RANK = { fail:0, unreachable:1, unavailable:2, advisory:3, ok:4 };
let doctorDoc = null, doctorPending = false;

/* Offline by default. A `--live` probe spends real model calls, so it is only
   ever started by an explicit click - a dashboard that quietly billed a provider
   round-trip on every visit would be a bug with an invoice attached. */
/* `live` picks WHICH verdict to read (the server caches offline and live
   separately); `force` restarts it. Keeping them separate matters for the
   follow-up poll below: re-polling with live=false would read the OFFLINE slot
   and overwrite the live verdict we are waiting for, and re-sending force=1
   would restart the probe on every tick instead of waiting for it. */
async function probeDoctor(live, force) {
  if (doctorPending) return;
  doctorPending = true;
  if (force) {
    doctorDoc = { ...(doctorDoc || {}), building:true, mode: live ? "live" : "offline" };
    renderDetail();
  }
  try {
    const qs = [live ? "live=1" : "", force ? "force=1" : ""].filter(Boolean).join("&");
    const res = await fetch("api/doctor.json" + (qs ? "?" + qs : ""), { cache:"no-store" });
    if (res.ok) doctorDoc = await res.json();
  } catch (e) { doctorDoc = { error:"could not reach api/doctor.json", checks:[], counts:{} }; }
  doctorPending = false;
  renderDetail();
  // A live probe runs in the server's background; poll the SAME slot until it
  // settles, without forcing.
  if (doctorDoc && doctorDoc.building) setTimeout(() => probeDoctor(live, false), 4000);
}

/* ── roost: Claude OAuth profile health (optional capability) ────────────── */
/* roost (claude-lb) is a per-machine optional install. The server probes for
   the binary and answers {"available": false} when absent — that answer is
   what keeps the whole section out of the nav, so a machine without roost
   never sees a dead menu entry. Fetches are tick- and click-driven, never on
   their own timer; roost itself caches probes, the server caches 60s. */
let roostDoc = null, roostPending = false;
async function fetchRoost(force) {
  if (roostPending) return;
  roostPending = true;
  try {
    const res = await fetch("api/roost.json" + (force ? "?force=1" : ""), { cache: "no-store" });
    if (res.ok) roostDoc = await res.json();
  } catch (e) { /* keep the last good pane; the main banner covers a dead server */ }
  roostPending = false;
  if (doc) { renderNav(); if (selected === "roost") renderDetail(); }
  // A forced probe runs in the server's background; settle-poll the cache
  // until it lands (bounded: building clears once the CLI returns).
  if (roostDoc && roostDoc.available && roostDoc.building)
    setTimeout(() => fetchRoost(false), 3000);
}
const resetIn = iso => {

}

/* Roll every lane this machine has a record of - live runs AND archived history -
   up by brain and by resolved model. History lanes carry a reduced digest with no
   `model`, which is why the model table is explicitly labelled as covering runs
   still on disk: counting archived lanes there would undercount silently. */
function fleetStats() {
  const brains = new Map(), models = new Map();
  const blank = () => ({ lanes:0, done:0, failed:0, stalled:0, running:0,
                         tokens:0, out:0, commits:0, runs:new Set(), models:new Set(),
                         laneTokens:[], laneRefs:[] });
  const addLane = (l, runId, live) => {
    if (!l || !l.brain) return;
    const b = brains.get(l.brain) || brains.set(l.brain, blank()).get(l.brain);
    b.lanes++; b[l.state] = (b[l.state] || 0) + 1;
    b.tokens += l.tokens_total || 0; b.out += l.tokens_out || 0;
    b.commits += l.commits || 0; b.runs.add(runId);
    b.laneTokens.push(l.tokens_total || 0);
    b.laneRefs.push(l);   // costRollup at render time — cost follows the chosen basis
    if (l.model) {
      b.models.add(l.model);
      const m = models.get(l.model) || models.set(l.model, { ...blank(), brain:l.brain }).get(l.model);
      m.lanes++; m.tokens += l.tokens_total || 0; m.out += l.tokens_out || 0;
      m.laneRefs.push(l); m.runs.add(runId);
      if (l.state === "failed") m.failed++;
    }
  };
  for (const r of doc.runs) for (const l of (r.lanes || [])) addLane(l, runKey(r), true);
  for (const h of (doc.history || [])) for (const l of (h.lanes || [])) addLane(l, histKey(h), false);
  return { brains, models };
}

/* Worst status wins: one failed check is what you need to see, and averaging it
   against four green ones is how a broken harness reads as fine. */
function harnessHealth(h) {
  if (!doctorDoc || !doctorDoc.checks?.length) return null;
  const hits = doctorDoc.checks.filter(c => h.checks.includes(c.name));
  if (!hits.length) return null;
  return hits.reduce((a, c) =>
    (STATUS_RANK[c.status] ?? 9) < (STATUS_RANK[a.status] ?? 9) ? c : a, hits[0]);
}

function harnessCard(h, stats) {
  const [, col] = brainOf(h.k);
  const s = stats.brains.get(h.k);
  const worst = harnessHealth(h);
  const dot = worst ? worst.status : "";
  const cap = worst
    ? `<span class="dstat ${dot}"></span>${esc(worst.status)}
       <span class="gap" title="${esc(worst.name)}: ${esc(worst.detail)}">${esc(worst.name)}</span>`
    : `<span class="dstat"></span>not probed<span class="gap">run a capacity probe</span>`;
  const sCost = s ? costRollup(s.laneRefs) : null;
  const seen = s
    ? `${chip("layers", nf(s.lanes), "lanes")}${chip("activity", tok(s.tokens), "tok")}
       <span class="chip" title="${esc(costTitle(sCost))}">${ico("coin")}${costFmt(sCost)}</span>
       ${s.commits ? chip("git", nf(s.commits), "commits") : ""}
       ${s.commits && sCost && sCost.usd != null
         ? `<span class="chip" title="rough efficiency: covered cost divided by commits landed by this harness's lanes">${ico("coin")}${usd(sCost.usd / s.commits)}<span style="color:var(--text-muted)">/commit</span></span>` : ""}
       ${s.failed ? chip("alert", nf(s.failed), "failed", "warn") : ""}`
    : `<span class="chip" title="no lane on this machine has ever run on this brain">never used</span>`;
  // Same collapse mechanism as a lane card, and the same rule about WHAT
  // collapse may hide: the chart, the numbers and the capacity dot stay, the
  // spec table folds. Namespaced "h:" so a harness can never collide with a
  // lane id in the shared `flipped` set.
  const ck = "h:" + h.k, shut = isCollapsed(ck);
  return `<div class="card ${!s && worst && worst.status !== "ok" ? "unused" : ""}${shut ? " collapsed" : ""}">
    <div class="hd">
      ${brandMark(h.k, col)}
      <span class="proj" style="color:${col};font-weight:600">${esc(h.k)}</span>
      <span class="tag">${esc(h.cls)}</span>
      ${h.commits ? "" : `<span class="tag" title="a codex lane cannot git commit: the worktree's git metadata lives in the MAIN repo's .git, outside the sandbox. The orchestrator reviews the diff and commits instead.">no self-commit</span>`}
      ${h.stream === "none — buffered to exit"
        ? `<span class="tag" title="no live stream, so the stall detector cannot substantiate a verdict for these lanes — the worker heartbeat is their only liveness signal">no stream</span>` : ""}
      <button class="caret" data-card="${esc(ck)}" aria-expanded="${!shut}"
        aria-label="${shut ? "Expand" : "Collapse"} ${esc(h.k)} details"
        title="${shut ? "show" : "hide"} the ${esc(h.k)} contract">${ico("chev")}</button>
    </div>
    <div class="sum">${esc(h.role)}</div>
    ${s ? distBars(s.laneTokens, col) : ""}
    <div class="statrow">${seen}</div>
    <div class="body">
      <dl class="spec">
        <dt>process</dt><dd>${esc(h.proc)}</dd>
        <dt>auth</dt><dd>${esc(h.auth)}</dd>
        <dt>isolation</dt><dd>${esc(h.sandbox)}</dd>
        <dt>live stream</dt><dd>${esc(h.stream)}</dd>
        <dt>concurrency</dt><dd>${esc(h.conc)} concurrent</dd>
        ${s && s.models.size ? `<dt>models seen</dt><dd>${esc([...s.models].join(", "))}</dd>` : ""}
      </dl>
    </div>
    <div class="hcap">${cap}</div>
  </div>`;
}

function fleetView() {
  const stats = fleetStats();
  const inUse = [...stats.brains.keys()];
  const totalLanes = [...stats.brains.values()].reduce((a, b) => a + b.lanes, 0);

  const totalCost = costRollup([...stats.brains.values()].flatMap(b => b.laneRefs));
  const avail = HARNESS.filter(h => { const w = harnessHealth(h);
    return w && w.status === "ok"; }).length;

  const checksBlock = d && d.checks?.length ? `

    </div>
    <div class="path mono">${ico("folder")}${esc((doc.roots || []).join("  ·  "))}</div>

    <div class="stats mono">
      <div class="stat ${avail ? "ok" : ""}"><b>${d ? avail : "—"}</b><span>available</span></div>
      <div class="stat"><b>${inUse.length}</b><span>in use</span></div>
      <div class="stat"><b>${stats.models.size}</b><span>models</span></div>
      <div class="stat"><b>${nf(totalLanes)}</b><span>lanes ever</span></div>

      <button class="tbtn" id="cExpand" title="Show every harness contract">
